<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: https://*.supabase.co http://*:54321; connect-src https://*.supabase.co http://*:54321; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1C1C56">
<title>Live</title>
<!--
  SigmaMarket · page du client pendant un live (D53).
  Le lien (#l=CODE&s=serveur&k=clé publique) vient du téléphone du vendeur. La page parle au serveur
  de la boutique, et à lui seul (la règle de sécurité ci-dessus n'autorise que Supabase et le serveur
  d'essai) : voir les articles, commander, suivre sa commande, y renoncer. Chaque commande garde ses
  articles le temps donné pour payer ; payée, le vendeur la valide ; sinon elle s'annule seule.
  Les petites photos des articles (D54) viennent du stockage du même serveur : la règle de sécurité
  est resserrée à son origine dès que le lien est lu (restreindreImages).
  Règles : live.js, copie de src/domain/live.ts, vérifiée par tests/domain/live.test.ts.
  ES2015, sans dépendance. Même dessin que la vitrine (index.html).
-->
<style>
:root{--creme:#FAF3E3;--ivoire:#FFFCF5;--blanc:#FFFFFF;--lin:#F1E6CF;--sable:#E7DAC0;--argile:#8F7757;--encre:#24160D;--encre-douce:#5A4634;--indigo:#2A2A78;--indigo-vif:#4141A0;--vert:#0B5F2F;--vert-clair:#DDF1DF;--rouge:#9E141A;--rouge-clair:#FBE3DE;--orange:#F28C16;--orange-fonce:#8A3C00;--orange-clair:#FDEBD0;--ombre-1:0 1px 3px rgba(36,22,13,.16);--ombre-2:0 3px 8px rgba(36,22,13,.22)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#FAF3E3;background:var(--creme);color:var(--encre);font:500 17px/22px system-ui,-apple-system,Roboto,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
svg{display:block}
.ico{width:24px;height:24px;fill:currentColor;flex:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:24px}
#app.avec-barre{padding-bottom:112px}
.f{font-size:.62em;font-weight:700;margin-left:.16em}
.cache{display:none!important}

/* En-tête : indigo, coins bas arrondis, motif « disque » derrière le bouton d'écoute */
.entete{position:relative;height:72px;display:flex;align-items:center;padding:0 8px;background:var(--indigo);border-radius:0 0 24px 24px;overflow:hidden;color:var(--ivoire)}
.entete>*{position:relative}
.entete>.motif{position:absolute;top:0;right:0;width:360px;height:72px}
.avant{flex:none;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.pastille{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--indigo-vif);color:var(--ivoire)}
.pastille .ico{width:28px;height:28px}
.pastille.retour{background:var(--ivoire);color:var(--encre);box-shadow:0 2px 5px rgba(13,13,46,.4)}
.titre{flex:1;min-width:0;margin:0 8px;font-size:20px;line-height:24px;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.ecoute{flex:none;width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;background:var(--ivoire);color:var(--indigo);box-shadow:0 2px 5px rgba(13,13,46,.4)}
.ecoute .ico{width:30px;height:30px}
.ecoute.parle{background:var(--indigo-vif);color:var(--ivoire)}

/* Bandeaux et cartes */
.bandeau{margin:12px 16px 0;padding:10px 12px;border-radius:16px;background:var(--ivoire);border:1px solid var(--sable);font-size:15px;line-height:20px;font-weight:600;color:var(--encre-douce)}
.bandeau .rang{display:flex;align-items:center}
.bandeau .rang+.rang{margin-top:6px}
.bandeau .ico{margin-right:10px}
.bandeau.vieux{background:var(--orange-clair);border:2px solid var(--orange);color:var(--encre)}
.pas.plein{opacity:.38}
.bandeau.ok{background:var(--vert-clair);border:2px solid var(--vert);color:var(--encre)}
.bandeau.chrome{background:var(--orange-clair);border:2px solid var(--orange);color:var(--encre);padding:12px}
.dessin-chrome{display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.dessin-chrome .rond{width:44px;height:44px;border-radius:22px;background:var(--ivoire);border:2px solid var(--encre);display:flex;align-items:center;justify-content:center}
.dessin-chrome .fleche{margin:0 8px;color:var(--encre)}
.carte{margin:12px 16px 0;padding:16px;background:var(--ivoire);border:1px solid var(--sable);border-radius:24px;box-shadow:var(--ombre-1)}
.titre-carte{display:flex;align-items:center;font-size:20px;line-height:24px;font-weight:800}
.titre-carte .ico{width:32px;height:32px;margin-right:10px}
.note{margin:8px 0 0;font-size:15px;line-height:20px;color:var(--encre-douce)}

/* La grille des articles : deux colonnes ; la photo en grand (carrée), le numéro en badge dessus ;
   sans photo, le numéro en très grand (comme la vitrine, index.html) */
.grille{display:flex;flex-wrap:wrap;justify-content:space-between;padding:12px 16px 0}
.tuile{position:relative;width:calc(50% - 6px);margin-bottom:12px;display:flex;flex-direction:column;background:var(--ivoire);border:1px solid var(--sable);border-radius:20px;overflow:hidden;box-shadow:var(--ombre-1)}
.tuile.prise{box-shadow:0 0 0 3px var(--encre),var(--ombre-2)}
.plaque{position:relative;height:96px;padding:0 12px 4px;background:var(--lin);display:flex;align-items:flex-end}
.numero{font-size:52px;line-height:56px;font-weight:800;letter-spacing:-1px;white-space:nowrap}
.numero .no{font-size:18px;font-weight:700;letter-spacing:0;margin-right:2px}
.numero.long{font-size:40px}
.numero.tres-long{font-size:32px}
.tuile.epuise .numero{opacity:.4}
.plaque.carre{display:block;height:auto;padding:0}
.plaque.carre:before{content:'';display:block;padding-top:100%}
.photo{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.photo.prete{opacity:1}
.tuile.epuise .photo.prete{opacity:.45;filter:grayscale(1)}
.plaque.carre .numero{position:absolute;left:8px;bottom:8px;height:32px;padding:0 9px;border-radius:12px;background:var(--ivoire);color:var(--encre);font-size:22px;line-height:32px;letter-spacing:0;box-shadow:var(--ombre-2)}
.plaque.carre .numero .no{font-size:13px}
.tuile.epuise .plaque.carre .numero{opacity:1}
.plaque.carre.photo-absente .numero{left:12px;bottom:4px;height:auto;padding:0;border-radius:0;background:none;box-shadow:none;font-size:52px;line-height:56px;letter-spacing:-1px}
.plaque.carre.photo-absente .numero .no{font-size:18px}
.plaque.carre.photo-absente .numero.long{font-size:40px}
.plaque.carre.photo-absente .numero.tres-long{font-size:32px}
.tuile.epuise .plaque.carre.photo-absente .numero{opacity:.4}
.etiquette{position:absolute;top:0;right:0;height:32px;padding:0 10px 0 7px;display:flex;align-items:center;border-radius:0 0 0 14px;border:solid var(--ivoire);border-width:0 0 2px 2px;font-size:13px;line-height:16px;font-weight:800;white-space:nowrap}
.etiquette .ico{width:18px;height:18px;margin-right:4px}
.etiquette.disponible{background:var(--vert);color:var(--blanc)}
.etiquette.bientot_fini{background:var(--orange);color:var(--encre)}
.etiquette.epuise{background:var(--rouge);color:var(--blanc)}
.corps{flex:1;padding:8px 12px 0}
.prix{font-size:22px;line-height:26px;font-weight:800;white-space:nowrap}
.prix.a-demander{font-size:15px;line-height:26px;color:var(--encre-douce)}
.nom{margin-top:2px;font-size:14px;line-height:18px;color:var(--encre-douce);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;min-height:36px}
.compteur{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 6px}
.pas{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.pas .ico{width:32px;height:32px}
.pas.plus{background:var(--encre);color:var(--ivoire);box-shadow:var(--ombre-2)}
.pas.moins{background:var(--ivoire);border:3px solid var(--encre);color:var(--encre)}
.pas.large{width:100%}
.pas[disabled]{opacity:.38;box-shadow:none}
.qte{flex:1;min-width:0;text-align:center;font-size:30px;line-height:34px;font-weight:800}
.qte.long{font-size:24px}
.qte.tres-long{font-size:18px}
.vide{padding:24px 16px;text-align:center;color:var(--encre-douce)}

/* Barre du bas : le panier en cours et Valider */
.barre{position:fixed;left:0;right:0;bottom:0;z-index:2;background:var(--ivoire);border-top:1px solid var(--sable);box-shadow:0 -2px 8px rgba(36,22,13,.12);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.barre-dedans{max-width:448px;margin:0 auto;display:flex;align-items:center}
.resume{flex:1;min-width:0;display:flex;align-items:center}
.rond-panier{position:relative;flex:none;width:52px;height:52px;border-radius:26px;background:var(--lin);display:flex;align-items:center;justify-content:center;margin-right:10px}
.rond-panier .ico{width:30px;height:30px}
.pastille-nombre{position:absolute;top:-4px;right:-6px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--encre);color:var(--ivoire);border:2px solid var(--ivoire);font-size:14px;line-height:22px;font-weight:800;text-align:center}
.resume-texte{min-width:0}
.resume-texte .petit{display:block;font-size:14px;line-height:18px;font-weight:600;color:var(--encre-douce);white-space:nowrap}
.resume-texte .total{display:block;font-size:26px;line-height:30px;font-weight:800;white-space:nowrap}
.resume-texte .aide{display:block;font-size:16px;line-height:20px;font-weight:700}

/* Boutons */
.bouton{height:64px;padding:0 20px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:22px;font-weight:700;white-space:nowrap;text-decoration:none}
.bouton .ico{width:30px;height:30px;margin-right:8px}
.bouton .ico.logo{width:42px;height:42px;margin-right:10px}
.bouton.valider{background:var(--vert);color:var(--blanc);box-shadow:var(--ombre-2)}
.bouton.neutre{background:var(--ivoire);border:3px solid var(--encre);color:var(--encre)}
.bouton.annuler{background:var(--rouge-clair);border:3px solid var(--rouge);color:var(--rouge)}
.bouton.large{width:100%}
.bouton.geant{height:72px;font-size:20px}
.bouton[disabled]{opacity:.38;box-shadow:none}
.rangee{display:flex;margin-top:12px}
.rangee>.bouton{flex:1;min-width:0;padding:0 8px;font-size:16px}
.rangee>.bouton .ico{width:26px;height:26px;margin-right:6px}
.rangee>.bouton+.bouton{margin-left:12px}
.espace{margin-top:12px}

/* Écran du panier */
.qr{margin:12px auto 0;width:100%;max-width:300px;padding:0;background:var(--blanc);border-radius:12px;border:1px solid var(--sable)}
.qr svg{width:100%;height:auto}
.total-panier{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px}
.total-panier .combien{font-size:17px;font-weight:700;color:var(--encre-douce)}
.total-panier .montant{font-size:36px;line-height:42px;font-weight:800;white-space:nowrap}
.ligne{display:flex;align-items:center;padding:8px 0;border-top:1px solid var(--sable)}
.ligne:first-child{border-top:0}
.badge{flex:none;min-width:48px;height:40px;padding:0 6px;margin-right:10px;border-radius:12px;background:var(--lin);font-size:20px;line-height:40px;font-weight:800;text-align:center}
.ligne-nom{flex:1;min-width:0;font-size:16px;line-height:20px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.ligne-qte{flex:none;margin:0 10px;font-size:20px;font-weight:800}
.ligne-prix{flex:none;font-size:17px;font-weight:800;white-space:nowrap}
.champ{display:flex;align-items:center;height:64px;margin-top:12px;padding:0 14px;border:2px solid var(--argile);border-radius:20px;background:var(--ivoire)}
.champ .ico{color:var(--encre-douce);margin-right:10px}
.champ input{flex:1;min-width:0;height:56px;border:0;background:none;font:inherit;font-size:18px;color:var(--encre);outline:none}
/* Le numéro, pays par pays (D64) : le drapeau et l'indicatif devant les chiffres, la liste des drapeaux à part */
.champ.tel{padding:0 12px 0 6px}
.drapeau-bouton{display:flex;align-items:center;flex:none;height:52px;margin-right:8px;padding:0 6px;border-radius:14px;background:var(--lin);border:1px solid var(--sable)}
.drapeau-bouton .indicatif{margin:0 2px 0 8px;font-size:17px;font-weight:800}
.drapeau-bouton .ico{width:22px;height:22px;margin:0;color:var(--encre-douce)}
.drapeau{width:36px;height:24px;border-radius:4px;border:1px solid var(--sable);flex:none}
.liste-pays{padding:4px 12px 12px}
.ligne-pays{display:flex;align-items:center;width:100%;min-height:64px;margin-top:8px;padding:8px 10px;border:2px solid var(--sable);border-radius:16px;background:var(--lin);text-align:left}
.ligne-pays.choisi{border-color:var(--vert);background:var(--ivoire)}
.ligne-pays .drapeau{width:60px;height:40px;margin-right:12px;border-radius:6px}
.ligne-pays .nom-pays{flex:1;min-width:0;font-weight:700;line-height:20px}
.ligne-pays .ind-pays{margin-left:8px;font-weight:800;color:var(--encre-douce)}
.compte-chiffres{margin:6px 4px 0;text-align:right;font-size:15px;font-weight:700;color:var(--encre-douce)}
.erreur{margin:48px 16px 0;text-align:center}
.rond-erreur{width:96px;height:96px;margin:0 auto 16px;border-radius:48px;background:var(--rouge-clair);color:var(--rouge);display:flex;align-items:center;justify-content:center}
.rond-erreur.neutre{background:var(--lin);color:var(--encre)}
.rond-erreur .ico{width:52px;height:52px}
.erreur h1{margin:0 0 8px;font-size:22px;line-height:28px;font-weight:800}
.erreur p{margin:0;font-size:17px;line-height:22px;color:var(--encre-douce)}
.pied-page{margin:20px 16px 0;font-size:13px;line-height:18px;color:var(--encre-douce);text-align:center}
.pied-info{margin:12px 16px 0;font-size:12px;line-height:17px;color:var(--encre-douce);text-align:center}
.pied-info a{color:var(--indigo);font-weight:700;text-decoration:underline}
noscript p{margin:32px 16px;font-size:20px;line-height:26px;font-weight:700;text-align:center}

/* Le live : en direct, le compte à rebours, les messages */
.direct{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;background:var(--rouge);color:var(--blanc);font-size:15px;font-weight:800;margin-right:10px}
.direct .point{width:10px;height:10px;border-radius:5px;background:var(--blanc);margin-right:6px}
.bandeau.alerte{background:var(--rouge-clair);border:2px solid var(--rouge);color:var(--encre)}
/* Le temps pour payer (D57) : une pastille compacte, un anneau qui se vide et les chiffres. Vert, puis orange, puis rouge. */
.compte{display:flex;align-items:center;justify-content:center;margin:12px 16px 0;height:80px;border-radius:40px;border:3px solid var(--vert-clair);background:var(--vert-clair);color:var(--vert);font-size:48px;line-height:52px;font-weight:800}
.compte .anneau{width:52px;height:52px;margin-right:14px;flex:none}
.compte .piste{fill:none;stroke:var(--sable);stroke-width:5}
.compte .reste{fill:none;stroke:var(--vert);stroke-width:5;stroke-linecap:round}
.compte.orange{background:var(--orange-clair);border-color:var(--orange);color:var(--orange-fonce)}
.compte.orange .reste{stroke:var(--orange)}
.compte.rouge{background:var(--rouge-clair);border-color:var(--rouge);color:var(--rouge)}
.compte.rouge .reste{stroke:var(--rouge)}
.arrivee{display:flex;align-items:center;justify-content:center;margin-top:12px;font-size:17px;font-weight:700;color:var(--encre-douce)}
.arrivee .rang-gros{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:56px;padding:0 8px;margin-left:10px;border-radius:28px;background:var(--encre);color:var(--ivoire);font-size:28px;font-weight:800}
.fin{margin:24px 16px 0;text-align:center}
.fin h1{margin:0 0 8px;font-size:24px;line-height:30px;font-weight:800}
.fin p{margin:0;font-size:17px;line-height:22px;color:var(--encre-douce)}
.rond-fin{width:112px;height:112px;margin:0 auto 16px;border-radius:56px;display:flex;align-items:center;justify-content:center}
.rond-fin .ico{width:64px;height:64px}
.rond-fin.vert{background:var(--vert);color:var(--blanc)}
.rond-fin.rouge{background:var(--rouge-clair);color:var(--rouge)}
.etiquette.reste{background:var(--orange);color:var(--encre)}
</style>
</head>
<body>
<noscript><p>Pour commander, ouvre ce lien avec Chrome.</p></noscript>
<div id="app"></div>
<script src="reglages.js?v=14"></script>
<script src="live.js?v=14"></script>
<script src="numero.js?v=14"></script>
<script>
(function () {
  'use strict';
  var L = window.VitrineLive;
  var R = window.SIGMA_REGLAGES;
  // Si numero.js manque (page recopiée sans lui, réseau coupé au mauvais moment), la page ne casse pas :
  // un seul pays, la Côte d'Ivoire, dix chiffres, comme avant.
  var N = window.VitrineNumero || (function () {
    var ci = { c: 'CI', i: '225', n: 'Côte d’Ivoire', l: [10], g: [2, 2, 2, 2, 2], d: '07', f: [['r', 0, 0, 20.4, 40, '#F77F00'], ['r', 20, 0, 20.4, 40, '#FFFFFF'], ['r', 40, 0, 20.4, 40, '#009E60']] };
    function chiffres(t) { return String(t || '').replace(/\D/g, ''); }
    function grouper(t) { return t.replace(/(\d{2})(?=\d)/g, '$1 '); }
    return {
      PAYS: [ci], CHIFFRES_MAX: 15, chiffres: chiffres, grouper: grouper,
      pays: function () { return ci; },
      paysDe: function (e) { return chiffres(e).indexOf('225') === 0 ? ci : null; },
      exemple: function () { return '07 00 00 00 00'; },
      depuis: function (e) {
        var d = chiffres(e);
        return { pays: 'CI', national: d.indexOf('225') === 0 && d.length === 13 ? d.slice(3) : d };
      },
      analyser: function (saisie) {
        var d = chiffres(saisie);
        if (d.length === 13 && d.indexOf('225') === 0) d = d.slice(3);
        var etat = d === '' ? 'vide' : d.length < 10 ? 'court' : d.length > 10 ? 'long' : 'bon';
        return { etat: etat, e164: etat === 'bon' ? '225' + d : null, pays: 'CI', chiffres: d, attendus: [10], longueur: d.length };
      },
      texteRefus: function (a) { return a.etat === 'court' ? 'Il manque des chiffres. Dans ce pays, un numéro a 10 chiffres.' : 'Il y a trop de chiffres. Dans ce pays, un numéro a 10 chiffres.'; },
    };
  })();
  var NS = 'http://www.w3.org/2000/svg';
  var app = document.getElementById('app');
  var STOCKAGE = 'sigmamarket.live.';
  var VOIX = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  var GARDE = 'SigmaMarket ne vérifie ni les boutiques ni les prix. Ne paie qu’au numéro du vendeur que tu connais.';
  // Ce qui reste se redemande toutes les 20 secondes : cent clients qui regardent tiennent dans le
  // transfert du plan gratuit (docs/SYNCHRONISATION.md). La commande, elle, toutes les 4 secondes.
  var SUIVI_ARTICLES_MS = 20000;
  var SUIVI_COMMANDE_MS = 4000;
  var HORLOGE_MS = 1000;

  // Dessins (24 x 24), ceux de la vitrine, et le direct.
  var DESSINS = {
    plus: 'M10.5 3.5h3v7h7v3h-7v7h-3v-7h-7v-3h7z',
    bas: 'M7 10l5 5 5-5z',
    moins: 'M3.5 10.5h17v3h-17z',
    coche: 'M3.3 12.6l2.2-2.2 4 4 9-9 2.2 2.2L9.5 18.8z',

    if (etat.live && !etat.live.ouvert) return nomBoutique() + '. Le live est fermé : on ne peut plus commander.';
    var l = lignes();
    var t = nomBoutique() + '. Live en direct. Choisis tes articles avec le bouton plus, puis touche Commander. Après, tu auras ' +
      minutesPourPayer() + ' minutes pour payer le vendeur, sinon la commande s’annule.';
    if (l.length) t += ' Ton panier : ' + articles(combien(l)) + ', ' + total(l) + ' francs.';
    return t + ' ' + GARDE + ' ' + information();
  }

  function vueArticles() {
    arreter();
    etat.vue = 'articles';
    document.title = nomBoutique();
    app.className = etat.live && etat.live.ouvert ? 'avec-barre' : '';
    app.textContent = '';
    app.appendChild(entete(nomBoutique(), null, texteArticles));
    var message = bandeauMessage();
    if (message) app.appendChild(message);
    if (!etat.live.ouvert) {
      app.appendChild(h('div', { class: 'fin' }, [
        h('div', { class: 'rond-fin rouge' }, [icone('direct')]),
        h('h1', {}, ['Le live est fermé']),
        h('p', {}, ['On ne peut plus commander.']),
      ]));
      plusTard(rafraichirArticles, SUIVI_ARTICLES_MS);
      return;
    }
    app.appendChild(h('div', { class: 'bandeau' }, [
      h('div', { class: 'rang' }, [h('span', { class: 'direct' }, [h('span', { class: 'point' }), 'EN DIRECT'])]),
      h('div', { class: 'rang' }, [icone('horloge'), minutesPourPayer() + ' min pour payer, après ta commande. Sinon elle s’annule.']),
    ]));
    etat.noeuds.grille = grille();
    app.appendChild(etat.noeuds.grille);
    app.appendChild(piedDePage());
    etat.noeuds.barre = barre();
    app.appendChild(etat.noeuds.barre);
    plusTard(rafraichirArticles, SUIVI_ARTICLES_MS);
  }

  /** Ce qui reste change pendant le live : la page le redemande, sans rien perdre du panier. */
  function rafraichirArticles() {
    if (etat.vue !== 'articles') return;
    appeler('live_voir', { p_code: etat.adresse.code }).then(function (r) {
      if (etat.vue !== 'articles') return;
      if (r && r.ok) {
        var etaitOuvert = etat.live.ouvert;
        recevoirVue(r);
        if (etaitOuvert !== etat.live.ouvert) { vueArticles(); return; }
        dessinerGrille();
        dessinerBarre();
      }
      plusTard(rafraichirArticles, SUIVI_ARTICLES_MS);
    }, function () {
      plusTard(rafraichirArticles, SUIVI_ARTICLES_MS);
    });
  }
  function recevoirVue(r) {
    etat.live = r.live;
    etat.articles = r.articles || [];
    etat.ecart = r.maintenant - Date.now();
    ajusterPanier();
  }

  // ------------------------------------------------------------ prénom, numéro, commander

  function vueFormulaire() {
    var l = lignes();
    if (!l.length) return;
    arreter();
    etat.vue = 'formulaire';
    app.className = '';
    app.textContent = '';
    app.appendChild(entete('Ta commande', vueArticles, function () {
      return 'Écris ton prénom et ton numéro de téléphone, puis touche Commander. Tu auras ' + minutesPourPayer() + ' minutes pour payer le vendeur. ' + GARDE + ' ' + information();
    }));
    var message = bandeauMessage();
    if (message) app.appendChild(message);
    app.appendChild(h('div', { class: 'carte' }, l.map(function (x) {
      return h('div', { class: 'ligne' }, [
        h('span', { class: 'badge' }, [String(x.numero)]),
        h('span', { class: 'ligne-nom' }, [sansCoche(x.nom) || 'Article n° ' + x.numero]),
        h('span', { class: 'ligne-qte' }, ['×' + x.quantite]),
        h('span', { class: 'ligne-prix' }, [montant(x.quantite * x.prix)]),
      ]);
    }).concat([h('div', { class: 'total-panier' }, [h('span', { class: 'combien' }, [articles(combien(l))]), h('span', { class: 'montant' }, [montant(total(l))])])])));
    var brouillon = etat.brouillon || {};
    var donne = N.depuis(lireGardee('telephone'), paysDuVendeur());
    if (etat.pays === null) etat.pays = donne.pays;
    var lePays = N.pays(etat.pays);
    var prenom = h('input', { type: 'text', maxlength: String(L.BORNES.prenom), autocomplete: 'given-name', 'aria-label': 'Ton prénom', placeholder: 'Ton prénom' });
    prenom.value = brouillon.prenom !== undefined ? brouillon.prenom : (lireGardee('prenom') || '');
    var telephone = h('input', { type: 'tel', inputmode: 'numeric', maxlength: String(N.CHIFFRES_MAX + 6), autocomplete: 'tel-national', 'aria-label': 'Ton numéro de téléphone', placeholder: N.exemple(etat.pays) });
    telephone.value = brouillon.telephone !== undefined ? brouillon.telephone : (donne.pays === etat.pays ? N.grouper(donne.national, lePays.g) : '');
    etat.brouillon = null;
    var autrePays = h('button', {
      class: 'drapeau-bouton', type: 'button',
      'aria-label': 'Pays du numéro : ' + lePays.n + ', indicatif ' + lePays.i + '. Toucher pour changer de pays',
      onclick: function () { etat.brouillon = { prenom: prenom.value, telephone: telephone.value }; vuePays(); },
    }, [drapeau(etat.pays), h('span', { class: 'indicatif' }, ['+' + lePays.i]), icone('bas')]);
    app.appendChild(h('div', { class: 'carte' }, [
      h('label', { class: 'champ' }, [icone('personne'), prenom]),
      h('div', { class: 'champ tel' }, [autrePays, telephone]),
      h('button', {
        class: 'bouton valider large geant espace', 'aria-label': 'Commander',
        onclick: function () { commander(prenom.value, telephone.value); },
      }, [icone('coche'), 'Commander']),
      h('p', { class: 'note' }, ['Le vendeur voit ton prénom et ton numéro, pour le paiement.']),
    ]));
    app.appendChild(piedDePage());
  }

  /** La liste des drapeaux : chaque pays se reconnaît à son dessin, et se dit à voix haute quand on le touche. */
  function vuePays() {
    arreter();
    etat.vue = 'pays';
    app.className = '';
    app.textContent = '';
    app.appendChild(entete('Pays du numéro', vueFormulaire, 'Touche le drapeau du pays où ton numéro marche.'));
    app.appendChild(h('div', { class: 'carte liste-pays' }, N.PAYS.map(function (p) {
      return h('button', {
        class: 'ligne-pays' + (p.c === etat.pays ? ' choisi' : ''), type: 'button',
        'aria-label': p.n + ', indicatif ' + p.i,
        onclick: function () { etat.pays = p.c; parler(p.n); vueFormulaire(); },
      }, [drapeau(p.c), h('span', { class: 'nom-pays' }, [p.n]), h('span', { class: 'ind-pays' }, ['+' + p.i])]);
    })));
  }

  function commander(prenom, telephone) {
    if (etat.envoi) return;
    var p = sansCoche(prenom).slice(0, L.BORNES.prenom);
    // Le numéro est jugé pour le pays du drapeau (nombre de chiffres, début) ; il part avec son indicatif.
    var a = N.analyser(telephone, etat.pays);
    var t = a.e164;
    var brouillon = { prenom: prenom, telephone: telephone };
    if (!p) { etat.brouillon = brouillon; dire(L.texteRefus('prenom_manquant')); vueFormulaire(); return; }
    if (a.etat === 'vide') { etat.brouillon = brouillon; dire(L.texteRefus('telephone_invalide')); vueFormulaire(); return; }
    if (t === null || t.length < 8 || t.length > N.CHIFFRES_MAX) { etat.brouillon = brouillon; dire(N.texteRefus(a)); vueFormulaire(); return; }
    garder('prenom', p, Date.now() + L.MEMOIRE_CLIENT_MS);
    garder('telephone', t, Date.now() + L.MEMOIRE_CLIENT_MS);
    etat.envoi = true;
    appeler('live_commander', {
      p_code: etat.adresse.code,
      p_commande: { prenom: p, telephone: t, lignes: lignes().map(function (x) { return { numero: x.numero, quantite: x.quantite }; }) },
    }).then(function (r) {
      etat.envoi = false;
      if (r && r.ok) {
        etat.jeton = r.jeton;
        etat.commande = r.commande;
        etat.ecart = r.maintenant - Date.now();
        garderJeton(etat.adresse.code, r.jeton, r.commande);
        etat.panier = {};
        vibrer();
        parler('Commande enregistrée. Tu as ' + L.minutesRestantes(L.resteAPayerMs(r.commande.expire_le, Date.now(), etat.ecart)) +
          ' minutes pour payer le vendeur.');
        vueCommande();
        return;
      }
      var refus = r && r.refus;
      if (refus === 'stock_insuffisant' && r.detail) {
        // Le serveur ne dit plus le stock exact : « plus que 2 » (3 ou moins), « épuisé », ou « disponible »
        // (plus de 3, mais moins que demandé) : le panier retombe alors à 3, qui est sûr de passer.
        r.detail.forEach(function (d) {
          if (d.reste > 0) etat.panier[d.numero] = Math.min(etat.panier[d.numero] || 0, d.reste);
          else if (d.niveau === 'epuise' || d.reste === 0) delete etat.panier[d.numero];
          else etat.panier[d.numero] = Math.min(etat.panier[d.numero] || 0, 3);
        });
      }
      if (refus === 'article_absent' && r.detail) r.detail.forEach(function (n) { delete etat.panier[n]; });
      dire(L.texteRefus(refus, r && r.detail));
      if (refus === 'live_ferme' || refus === 'stock_insuffisant' || refus === 'article_absent' || refus === 'trop_de_commandes') {
        recharger();
        return;
      }
      vueFormulaire();
    }, function () {
      etat.envoi = false;
      dire('Pas de réseau. Ta commande n’est pas partie. Réessaie.');
      vueFormulaire();
    });
  }

  // ------------------------------------------------------------ la commande : le temps pour payer

  function texteCommande() {
    var c = etat.commande;
    if (!c) return '';
    if (c.etat === 'validee') return 'Ta commande est validée. Merci !';
    if (c.etat === 'annulee') return texteFin(c).join(' ');
    var reste = L.resteAPayerMs(c.expire_le, Date.now(), etat.ecart);
    return 'Commande numéro ' + c.rang + ', ' + total(c.lignes.map(function (x) { return { quantite: x.quantite, prix: x.prix_unitaire }; })) +
      ' francs. Il te reste ' + L.minutesRestantes(reste) + ' minutes pour payer le vendeur. Quand il a reçu l’argent, il valide ta commande. ' +
      'Sinon elle s’annule seule. ' + GARDE + ' ' + information();
  }
  function texteFin(c) {
    if (c.annulee_par === 'temps') return ['Temps fini', 'Ta commande est annulée : le temps pour payer est passé.'];
    if (c.annulee_par === 'client') return ['Commande annulée', 'Tu as annulé ta commande.'];
    return ['Commande annulée', 'Le vendeur a annulé ta commande.'];
  }

  function vueCommande() {
    arreter();
    var c = etat.commande;
    etat.vue = 'commande';
    app.className = '';
    app.textContent = '';
    app.appendChild(entete(nomBoutique(), null, texteCommande));
    var message = bandeauMessage();
    if (message) app.appendChild(message);
    if (c.etat !== 'attente') {
      var fin = c.etat === 'validee' ? ['Commande validée', 'Le vendeur a reçu ton paiement. Merci !'] : texteFin(c);
      app.appendChild(h('div', { class: 'fin' }, [
        h('div', { class: 'rond-fin ' + (c.etat === 'validee' ? 'vert' : 'rouge') }, [icone(c.etat === 'validee' ? 'coche' : 'croix')]),
        h('h1', {}, [fin[0]]),
        h('p', {}, [fin[1]]),
      ]));
    } else {
      etat.baseTemps = 0;
      etat.noeuds.anneau = anneau();
      etat.noeuds.compte = h('div', { class: 'compte', role: 'timer', 'aria-live': 'off' }, [etat.noeuds.anneau.svg, h('span', {}, [''])]);
      app.appendChild(etat.noeuds.compte);
      app.appendChild(h('div', { class: 'arrivee' }, ['Ta place', h('span', { class: 'rang-gros' }, [String(c.rang)])]));
      app.appendChild(h('div', { class: 'bandeau vieux' }, [
        h('div', { class: 'rang' }, [icone('horloge'), 'Paie maintenant le vendeur. Quand il a reçu l’argent, il valide ta commande. Sinon elle s’annule à la fin du temps.']),
      ]));
      // Le numéro vient du serveur : des chiffres, ou pas de lien (jamais un texte qui change l'adresse).
      var numeroVendeur = etat.live ? L.numeroWhatsApp(etat.live.whatsapp) : null;
      if (numeroVendeur) {
        var texte = 'Bonjour, j’ai commandé pendant le live : numéro ' + c.rang + ', ' + c.prenom + ', ' +
          total(c.lignes.map(function (x) { return { quantite: x.quantite, prix: x.prix_unitaire }; })) + ' F. Comment je paie ?';
        app.appendChild(h('div', { class: 'carte' }, [
          h('a', { class: 'bouton valider large', href: 'https://wa.me/' + numeroVendeur + '?text=' + encodeURIComponent(texte), target: '_blank', rel: 'noopener noreferrer' },
            [icone('whatsapp'), 'Écrire au vendeur']),
        ]));
      }
    }
    app.appendChild(h('div', { class: 'carte' }, c.lignes.map(function (x) {
      return h('div', { class: 'ligne' }, [
        h('span', { class: 'badge' }, [String(x.numero)]),
        h('span', { class: 'ligne-nom' }, [sansCoche(x.nom) || 'Article n° ' + x.numero]),
        h('span', { class: 'ligne-qte' }, ['×' + x.quantite]),
        h('span', { class: 'ligne-prix' }, [montant(x.quantite * x.prix_unitaire)]),
      ]);
    }).concat([h('div', { class: 'total-panier' }, [h('span', { class: 'combien' }, ['Total']), h('span', { class: 'montant' }, [montant(c.total)])])])));
    if (c.etat === 'attente') {
      app.appendChild(h('div', { class: 'carte' }, [
        h('button', { class: 'bouton annuler large', 'aria-label': 'Annuler ma commande', onclick: renoncer }, [icone('croix'), 'Annuler ma commande']),
      ]));
      tic();
      plusTard(suivreCommande, SUIVI_COMMANDE_MS);
    } else {
      app.appendChild(h('div', { class: 'carte' }, [
        h('button', { class: 'bouton neutre large', 'aria-label': 'Commander encore', onclick: recommencer }, [icone('recommencer'), 'Commander encore']),
      ]));
    }
    app.appendChild(piedDePage());
  }

  /** Chaque seconde : le temps qui reste, et sa couleur. À zéro, la commande se relit (annulée par le temps). */
  function tic() {
    var c = etat.commande;
    if (etat.vue !== 'commande' || !c || c.etat !== 'attente') return;
    var reste = L.resteAPayerMs(c.expire_le, Date.now(), etat.ecart);
    // Le temps de CETTE commande : celui du live, ou plus s'il en reste davantage (le vendeur a pu
    // régler le live sur moins de temps après qu'elle soit arrivée) ; l'anneau ne dépasse jamais « plein ».
    var base = Math.max(etat.live ? etat.live.delai_ms : 0, etat.baseTemps || 0, reste);
    etat.baseTemps = base;
    var teinte = L.teinteCompteARebours(reste, base);
    etat.noeuds.compte.className = 'compte' + (teinte === 'normal' ? '' : ' ' + teinte);
    etat.noeuds.compte.lastChild.textContent = L.formaterCompteARebours(reste);
    // Un live.js plus ancien, resté en cache, n'a pas l'anneau : le chiffre et la couleur suffisent.
    if (L.traitAnneau && L.partRestante) {
      var trait = L.traitAnneau(L.partRestante(reste, base), RAYON_ANNEAU);
      etat.noeuds.anneau.reste.setAttribute('stroke-dasharray', trait.tour + ' ' + trait.tour);
      etat.noeuds.anneau.reste.setAttribute('stroke-dashoffset', String(trait.decalage));
      etat.noeuds.anneau.reste.setAttribute('visibility', trait.vide ? 'hidden' : 'visible');
    }
    if (reste <= 0) { suivreCommande(); return; }
    etat.horloge = setTimeout(tic, HORLOGE_MS);
  }

  function suivreCommande() {
    if (etat.vue !== 'commande') return;
    appeler('live_ma_commande', { p_code: etat.adresse.code, p_jeton: etat.jeton }).then(function (r) {
      if (etat.vue !== 'commande') return;
      if (r && r.ok) {
        var avant = etat.commande.etat;
        etat.commande = r.commande;
        etat.ecart = r.maintenant - Date.now();
        if (r.commande.etat !== avant) {
          vibrer();
          parler(r.commande.etat === 'validee' ? 'Ta commande est validée. Merci !' : texteFin(r.commande).join('. '));
          vueCommande();
          return;
        }
      }
      plusTard(suivreCommande, SUIVI_COMMANDE_MS);
    }, function () {
      plusTard(suivreCommande, SUIVI_COMMANDE_MS);
    });
  }

  function renoncer() {
    if (etat.envoi) return;
    etat.envoi = true;
    appeler('live_annuler_ma_commande', { p_code: etat.adresse.code, p_jeton: etat.jeton }).then(function (r) {
      etat.envoi = false;
      if (r && r.ok) {
        etat.commande = r.commande;
        parler('Commande annulée.');
        vueCommande();
      }
    }, function () {
      etat.envoi = false;
      dire('Pas de réseau. Réessaie.');
      vueCommande();
    });
  }

  function recommencer() {
    ecrire('jeton.' + etat.adresse.code, null);
    etat.jeton = null;
    etat.commande = null;
    recharger();
  }

  // ------------------------------------------------------------ départ

  function vueErreur(titre, texte) {
    arreter();
    etat.vue = 'erreur';
    app.className = '';
    app.textContent = '';
    app.appendChild(entete('Live', null, titre + '. ' + texte));
    app.appendChild(h('div', { class: 'erreur' }, [
      h('div', { class: 'rond-erreur' }, [icone('lien')]),
      h('h1', {}, [titre]),
      h('p', {}, [texte]),
    ]));
    if (etat.adresse) {
      app.appendChild(h('div', { class: 'carte' }, [
        h('button', { class: 'bouton neutre large', 'aria-label': 'Réessayer', onclick: recharger }, [icone('recommencer'), 'Réessayer']),
      ]));
    }
  }

  function recharger() {
    arreter();
    etat.vue = 'chargement';
    app.className = '';
    app.textContent = '';
    app.appendChild(entete('Live', null, 'Un instant.'));
    app.appendChild(h('p', { class: 'vide' }, ['Un instant…']));
    appeler('live_voir', { p_code: etat.adresse.code }).then(function (r) {
      if (!r || !r.ok) {
        vueErreur('Live introuvable', L.texteRefus(r && r.refus));
        return;
      }
      recevoirVue(r);
      // Le jeton a une fin : celle de la commande, et quelques minutes. Au-delà, il est effacé et la
      // commande n'est plus montrée à qui rouvre la page sur ce téléphone.
      etat.jeton = lireGardee('jeton.' + etat.adresse.code);
      if (!etat.jeton) { vueArticles(); return; }
      return appeler('live_ma_commande', { p_code: etat.adresse.code, p_jeton: etat.jeton }).then(function (m) {
        if (m && m.ok && m.commande.etat === 'attente') {
          etat.commande = m.commande;
          etat.ecart = m.maintenant - Date.now();
          vueCommande();
          return;
        }
        // Une commande finie (validée, annulée) : on la dit une fois, puis on repart des articles.
        if (m && m.ok) {
          etat.message = { texte: m.commande.etat === 'validee' ? 'Ta commande précédente est validée. Merci !' : texteFin(m.commande).join(' : '), alerte: m.commande.etat !== 'validee' };
        }
        ecrire('jeton.' + etat.adresse.code, null);
        etat.jeton = null;
        vueArticles();
      });
    }).then(null, function () {
      vueErreur('Pas de réseau', 'Le live a besoin d’internet. Vérifie ta connexion, puis réessaie.');
    });
  }

  function demarrer() {
    etat.hash = location.hash;
    etat.adresse = L.lireAdresseLive(location.href);
    if (!etat.adresse) {
      // Le projet de SigmaMarket n'est pas encore posé dans reglages.js : la page ne parle à aucun autre serveur.
      if (R.SERVEUR_OFFICIEL === '' && !R.essai) {
        vueErreur('Page pas encore prête', 'Cette page n’est pas encore ouverte. Demande au vendeur de t’écrire quand elle le sera.');
        return;
      }
      vueErreur('Ce lien est abîmé', 'Demande au vendeur de te renvoyer le lien de son live.');
      return;
    }
    etat.photos = {};
    restreindreImages(etat.adresse.serveur.url.replace(/\/+$/, ''));
    recharger();
  }

  window.addEventListener('hashchange', function () {
    if (location.hash !== etat.hash) demarrer();
  });
  oublierPerimes();
  demarrer();
})();
</script>
</body>
</html>
