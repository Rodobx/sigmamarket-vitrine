<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: https://*.supabase.co http://*:54321; connect-src https://*.supabase.co http://*:54321; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1C1C56">
<title>Vitrine</title>
<!--
  SigmaMarket · page du client de la vitrine.
  Le catalogue arrive dans l'adresse (#c=…), le panier repart dans l'adresse (#p=…) : sans serveur,
  le code QR et WhatsApp, comme toujours. Les petites photos (D54) viennent du stockage de la
  boutique, et de lui seul.
  La commande directe (D85, docs/COMMANDE-DIRECTE-CONTRAT.md) : un catalogue en version 3 porte le
  code de la vitrine ; la page demande alors au serveur de SigmaMarket, et à lui seul (reseau.js,
  la règle de sécurité ci-dessus puis resserrée à son origine), si la boutique reçoit les paniers.
  Oui en 5 s : « Commander », « Envoyer à … » et le suivi ; sinon, le parcours d'aujourd'hui.
  Formats : format.js, copie de src/domain/vitrine.ts, vérifiée par tests/domain/vitrine.test.ts.
  ES2015, sans dépendance ; QR dessiné par toqr (MIT, licence plus bas). sw.js garde la page dans le
  téléphone, pour qu'elle s'ouvre sans réseau.
-->
<style>
:root{--creme:#FAF3E3;--ivoire:#FFFCF5;--blanc:#FFFFFF;--lin:#F1E6CF;--sable:#E7DAC0;--argile:#8F7757;--encre:#24160D;--encre-douce:#5A4634;--indigo:#2A2A78;--indigo-vif:#4141A0;--vert:#0B5F2F;--vert-clair:#DDF1DF;--rouge:#9E141A;--rouge-clair:#FBE3DE;--orange:#F28C16;--orange-fonce:#8A3C00;--orange-clair:#FDEBD0;--ombre-1:0 1px 3px rgba(36,22,13,.16);--ombre-2:0 3px 8px rgba(36,22,13,.22)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#FAF3E3;background:var(--creme);color:var(--encre);font:500 17px/22px system-ui,-apple-system,Roboto,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
svg{display:block}
.ico{width:24px;height:24px;fill:currentColor;flex:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:24px}
#app.avec-barre{padding-bottom:112px}
.f{font-size:.62em;font-weight:700;margin-left:.16em}
.cache{display:none!important}

/* En-tête : indigo, coins bas arrondis, motif « disque » derrière le bouton d'écoute */
.entete{position:relative;height:72px;display:flex;align-items:center;padding:0 8px;background:var(--indigo);border-radius:0 0 24px 24px;overflow:hidden;color:var(--ivoire)}
.entete>*{position:relative}
.entete>.motif{position:absolute;top:0;right:0;width:360px;height:72px}
.avant{flex:none;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.pastille{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--indigo-vif);color:var(--ivoire)}
.pastille .ico{width:28px;height:28px}
.pastille.retour{background:var(--ivoire);color:var(--encre);box-shadow:0 2px 5px rgba(13,13,46,.4)}
.titre{flex:1;min-width:0;margin:0 8px;font-size:20px;line-height:24px;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.ecoute{flex:none;width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;background:var(--ivoire);color:var(--indigo);box-shadow:0 2px 5px rgba(13,13,46,.4)}
.ecoute .ico{width:30px;height:30px}
.ecoute.parle{background:var(--indigo-vif);color:var(--ivoire)}

/* Bandeaux et cartes */
.bandeau{margin:12px 16px 0;padding:10px 12px;border-radius:16px;background:var(--ivoire);border:1px solid var(--sable);font-size:15px;line-height:20px;font-weight:600;color:var(--encre-douce)}
.bandeau .rang{display:flex;align-items:center}
.bandeau .rang+.rang{margin-top:6px}
.bandeau .ico{margin-right:10px}
.bandeau.vieux{background:var(--orange-clair);border:2px solid var(--orange);color:var(--encre)}
.pas.plein{opacity:.38}
.bandeau.ok{background:var(--vert-clair);border:2px solid var(--vert);color:var(--encre)}
.bandeau.chrome{background:var(--orange-clair);border:2px solid var(--orange);color:var(--encre);padding:12px}
.dessin-chrome{display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.dessin-chrome .rond{width:44px;height:44px;border-radius:22px;background:var(--ivoire);border:2px solid var(--encre);display:flex;align-items:center;justify-content:center}
.dessin-chrome .fleche{margin:0 8px;color:var(--encre)}
.carte{margin:12px 16px 0;padding:16px;background:var(--ivoire);border:1px solid var(--sable);border-radius:24px;box-shadow:var(--ombre-1)}
.titre-carte{display:flex;align-items:center;font-size:20px;line-height:24px;font-weight:800}
.titre-carte .ico{width:32px;height:32px;margin-right:10px}
.note{margin:8px 0 0;font-size:15px;line-height:20px;color:var(--encre-douce)}

/* La grille : la photo en grand, le numéro en badge dessus ; sans photo, le numéro en très grand */
.grille{display:flex;flex-wrap:wrap;justify-content:space-between;padding:12px 16px 0}
.tuile{position:relative;width:calc(50% - 6px);margin-bottom:12px;display:flex;flex-direction:column;background:var(--ivoire);border:1px solid var(--sable);border-radius:20px;overflow:hidden;box-shadow:var(--ombre-1)}
.tuile.prise{box-shadow:0 0 0 3px var(--encre),var(--ombre-2)}
.plaque{position:relative;height:96px;padding:0 12px 4px;background:var(--lin);display:flex;align-items:flex-end}
.numero{font-size:52px;line-height:56px;font-weight:800;letter-spacing:-1px;white-space:nowrap}
.numero .no{font-size:18px;font-weight:700;letter-spacing:0;margin-right:2px}
.numero.long{font-size:40px}
.numero.tres-long{font-size:32px}
.tuile.epuise .numero{opacity:.4}
.plaque.carre{display:block;height:auto;padding:0}
.plaque.carre:before{content:'';display:block;padding-top:100%}
.photo{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.photo.prete{opacity:1}
.tuile.epuise .photo.prete{opacity:.45;filter:grayscale(1)}
.plaque.carre .numero{position:absolute;left:8px;bottom:8px;height:32px;padding:0 9px;border-radius:12px;background:var(--ivoire);color:var(--encre);font-size:22px;line-height:32px;letter-spacing:0;box-shadow:var(--ombre-2)}
.plaque.carre .numero .no{font-size:13px}
.tuile.epuise .plaque.carre .numero{opacity:1}
.plaque.carre.photo-absente .numero{left:12px;bottom:4px;height:auto;padding:0;border-radius:0;background:none;box-shadow:none;font-size:52px;line-height:56px;letter-spacing:-1px}
.plaque.carre.photo-absente .numero .no{font-size:18px}
.plaque.carre.photo-absente .numero.long{font-size:40px}
.plaque.carre.photo-absente .numero.tres-long{font-size:32px}
.tuile.epuise .plaque.carre.photo-absente .numero{opacity:.4}
.etiquette{position:absolute;top:0;right:0;height:32px;padding:0 10px 0 7px;display:flex;align-items:center;border-radius:0 0 0 14px;border:solid var(--ivoire);border-width:0 0 2px 2px;font-size:13px;line-height:16px;font-weight:800;white-space:nowrap}
.etiquette .ico{width:18px;height:18px;margin-right:4px}
.etiquette.disponible{background:var(--vert);color:var(--blanc)}
.etiquette.bientot_fini{background:var(--orange);color:var(--encre)}
.etiquette.epuise{background:var(--rouge);color:var(--blanc)}
.corps{flex:1;padding:8px 12px 0}
.prix{font-size:22px;line-height:26px;font-weight:800;white-space:nowrap}
.prix.a-demander{font-size:15px;line-height:26px;color:var(--encre-douce)}
.nom{margin-top:2px;font-size:14px;line-height:18px;color:var(--encre-douce);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;min-height:36px}
.compteur{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 6px}
.pas{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.pas .ico{width:32px;height:32px}
.pas.plus{background:var(--encre);color:var(--ivoire);box-shadow:var(--ombre-2)}
.pas.moins{background:var(--ivoire);border:3px solid var(--encre);color:var(--encre)}
.pas.large{width:100%}
.pas[disabled]{opacity:.38;box-shadow:none}
.qte{flex:1;min-width:0;text-align:center;font-size:30px;line-height:34px;font-weight:800}
.qte.long{font-size:24px}
.qte.tres-long{font-size:18px}
.vide{padding:24px 16px;text-align:center;color:var(--encre-douce)}

/* Barre du bas : le panier en cours et Valider */
.barre{position:fixed;left:0;right:0;bottom:0;z-index:2;background:var(--ivoire);border-top:1px solid var(--sable);box-shadow:0 -2px 8px rgba(36,22,13,.12);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.barre-dedans{max-width:448px;margin:0 auto;display:flex;align-items:center}
.resume{flex:1;min-width:0;display:flex;align-items:center}
.rond-panier{position:relative;flex:none;width:52px;height:52px;border-radius:26px;background:var(--lin);display:flex;align-items:center;justify-content:center;margin-right:10px}
.rond-panier .ico{width:30px;height:30px}
.pastille-nombre{position:absolute;top:-4px;right:-6px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--encre);color:var(--ivoire);border:2px solid var(--ivoire);font-size:14px;line-height:22px;font-weight:800;text-align:center}
.resume-texte{min-width:0}
.resume-texte .petit{display:block;font-size:14px;line-height:18px;font-weight:600;color:var(--encre-douce);white-space:nowrap}
.resume-texte .total{display:block;font-size:26px;line-height:30px;font-weight:800;white-space:nowrap}
.resume-texte .aide{display:block;font-size:16px;line-height:20px;font-weight:700}

/* Boutons */
.bouton{height:64px;padding:0 20px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:22px;font-weight:700;white-space:nowrap;text-decoration:none}
.bouton .ico{width:30px;height:30px;margin-right:8px}
.bouton .ico.logo{width:42px;height:42px;margin-right:10px}
.bouton.valider{background:var(--vert);color:var(--blanc);box-shadow:var(--ombre-2)}
.bouton.neutre{background:var(--ivoire);border:3px solid var(--encre);color:var(--encre)}
.bouton.annuler{background:var(--rouge-clair);border:3px solid var(--rouge);color:var(--rouge)}
.bouton.large{width:100%}
.bouton.geant{height:72px;font-size:20px}
.bouton[disabled]{opacity:.38;box-shadow:none}
.rangee{display:flex;margin-top:12px}
.rangee>.bouton{flex:1;min-width:0;padding:0 8px;font-size:16px}
.rangee>.bouton .ico{width:26px;height:26px;margin-right:6px}
.rangee>.bouton+.bouton{margin-left:12px}
.espace{margin-top:12px}

/* Écran du panier */
.qr{margin:12px auto 0;width:100%;max-width:300px;padding:0;background:var(--blanc);border-radius:12px;border:1px solid var(--sable)}
.qr svg{width:100%;height:auto}
.total-panier{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px}
.total-panier .combien{font-size:17px;font-weight:700;color:var(--encre-douce)}
.total-panier .montant{font-size:36px;line-height:42px;font-weight:800;white-space:nowrap}
.ligne{display:flex;align-items:center;padding:8px 0;border-top:1px solid var(--sable)}
.ligne:first-child{border-top:0}
.badge{flex:none;min-width:48px;height:40px;padding:0 6px;margin-right:10px;border-radius:12px;background:var(--lin);font-size:20px;line-height:40px;font-weight:800;text-align:center}
.ligne-nom{flex:1;min-width:0;font-size:16px;line-height:20px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.ligne-qte{flex:none;margin:0 10px;font-size:20px;font-weight:800}
.ligne-prix{flex:none;font-size:17px;font-weight:800;white-space:nowrap}
.champ{display:flex;align-items:center;height:64px;margin-top:12px;padding:0 14px;border:2px solid var(--argile);border-radius:20px;background:var(--ivoire)}
.champ .ico{color:var(--encre-douce);margin-right:10px}
.champ input{flex:1;min-width:0;height:56px;border:0;background:none;font:inherit;font-size:18px;color:var(--encre);outline:none}
.erreur{margin:48px 16px 0;text-align:center}
.rond-erreur{width:96px;height:96px;margin:0 auto 16px;border-radius:48px;background:var(--rouge-clair);color:var(--rouge);display:flex;align-items:center;justify-content:center}
.rond-erreur.neutre{background:var(--lin);color:var(--encre)}
.rond-erreur .ico{width:52px;height:52px}
.erreur h1{margin:0 0 8px;font-size:22px;line-height:28px;font-weight:800}
.erreur p{margin:0;font-size:17px;line-height:22px;color:var(--encre-douce)}
.pied-page{margin:20px 16px 0;font-size:13px;line-height:18px;color:var(--encre-douce);text-align:center}
.pied-info{margin:12px 16px 0;font-size:12px;line-height:17px;color:var(--encre-douce);text-align:center}
.pied-info a{color:var(--indigo);font-weight:700;text-decoration:underline}
noscript p{margin:32px 16px;font-size:20px;line-height:26px;font-weight:700;text-align:center}

/* La vitrine en ligne (D85) : « Commander », « Ton panier », le suivi « Ton panier n° 4 » */
.ico.petite{width:20px;height:20px;margin-right:8px;vertical-align:-4px;display:inline-block}
.marge{margin:12px 16px 0}
.centre{text-align:center}
.note.centre{text-align:center}
.note .ico.petite{color:var(--encre-douce)}
.p-marge,.note.marge{margin:12px 16px 0}
.attente{margin:48px 16px 0;display:flex;flex-direction:column;align-items:center;font-size:18px;font-weight:700;color:var(--encre-douce)}
.anneau{display:inline-block;width:28px;height:28px;margin:0 10px 0 0;border-radius:50%;border:4px solid currentColor;border-right-color:transparent;animation:tourne .9s linear infinite;flex:none}
.attente .anneau{width:44px;height:44px;margin:0 0 12px;color:var(--indigo)}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.anneau{animation-duration:3s}}
.bouton.petit{height:48px;padding:0 14px;font-size:16px;border-width:2px}
.bouton.petit .ico{width:24px;height:24px}
.bouton.en-cours{opacity:.85}
.prix-boutique{display:block;width:100%;padding:16px 4px;text-align:center;font-size:15px;font-weight:700;color:var(--encre-douce)}
.compteur .bouton.petit{white-space:normal;line-height:18px;text-align:left}
.pied-garde{margin:20px 16px 0;font-size:13px;line-height:18px;color:var(--encre-douce);text-align:center}
.pied-garde a,.lien-discret{color:var(--indigo);font-weight:700;text-decoration:underline}
.lien-discret{min-height:48px;padding:0 8px;font-size:15px}
.lien-discret.grand{min-height:64px;font-size:16px}
.rang-liens{display:flex;justify-content:space-between;margin-top:4px}
.vignette{position:relative;flex:none;width:56px;height:56px;margin-right:10px}
.mini{display:block;width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--lin)}
.mini.sans{font-size:16px;line-height:56px;font-weight:800;text-align:center}
.fois{position:absolute;right:-4px;bottom:-4px;min-width:26px;height:22px;padding:0 5px;border-radius:11px;background:var(--encre);color:var(--ivoire);border:2px solid var(--ivoire);font-size:12px;line-height:18px;font-weight:800;text-align:center}
.vignettes{display:flex;flex-wrap:wrap}
.dernier .rang-titre{display:flex;align-items:center;font-size:16px;font-weight:800}
.dernier .rang-titre .ico{margin-right:8px;color:var(--vert)}
.rang-dernier{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.rang-dernier .bouton{padding:0 12px;font-size:16px}
.etiquette-champ{display:block;margin-top:14px;font-size:16px;font-weight:800}
.etiquette-champ:first-child{margin-top:0}
.facultatif{font-weight:600;color:var(--encre-douce)}
.champ.faux{border-color:var(--orange)}
.champ.tel{padding:0 12px 0 6px}
.coche-verte{flex:none;width:40px;height:40px;border-radius:20px;background:var(--vert);color:var(--blanc);display:flex;align-items:center;justify-content:center}
/* Le numéro bon : la coche se pose au coin du champ, hors de la ligne, pour ne jamais cacher un chiffre (v19, page à 360 px). */
.champ.tel{position:relative}
.champ.tel.bon{border-color:var(--vert);border-width:3px}
.champ.tel .coche-verte{position:absolute;top:-12px;right:-10px;width:30px;height:30px;border-radius:15px;border:2px solid var(--ivoire)}
.coche-verte .ico{fill:var(--blanc);color:var(--blanc);width:20px;height:20px}
.aide-erreur{margin:6px 4px 0;font-size:16px;line-height:20px;font-weight:800;color:var(--orange-fonce)}
.drapeau-bouton{display:flex;align-items:center;flex:none;height:52px;margin-right:8px;padding:0 6px;border-radius:14px;background:var(--lin);border:1px solid var(--sable)}
.drapeau-bouton .indicatif{margin:0 2px 0 8px;font-size:17px;font-weight:800}
.drapeau-bouton .ico{width:22px;height:22px;margin:0;color:var(--encre-douce)}
.drapeau{width:36px;height:24px;border-radius:4px;border:1px solid var(--sable);flex:none}
.liste-pays{padding:4px 12px 12px}
.ligne-pays{display:flex;align-items:center;width:100%;min-height:64px;margin-top:8px;padding:8px 10px;border:2px solid var(--sable);border-radius:16px;background:var(--lin);text-align:left}
.ligne-pays.choisi{border-color:var(--vert);background:var(--ivoire)}
.ligne-pays .drapeau{width:60px;height:40px;margin-right:12px;border-radius:6px}
.ligne-pays .nom-pays{flex:1;min-width:0;font-weight:700;line-height:20px}
.ligne-pays .ind-pays{margin-left:8px;font-weight:800;color:var(--encre-douce)}
.identite{display:flex;align-items:center}
.identite .qui{flex:1;min-width:0;margin-left:10px;display:flex;flex-direction:column}
.identite .prenom{font-size:18px;font-weight:800}
.identite .numero-client{font-size:17px;font-weight:700;color:var(--encre-douce)}
.crayon{flex:none;width:56px;height:56px;border-radius:16px;border:3px solid var(--encre);display:flex;align-items:center;justify-content:center}
.titre-petit{font-size:16px;font-weight:800}
.etapes-apres{display:flex;align-items:flex-start;justify-content:space-between;margin-top:10px}
.etape-apres{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:14px;line-height:18px;font-weight:700}
.rond-etape{flex:none;width:44px;height:44px;margin-bottom:6px;border-radius:22px;background:var(--lin);display:flex;align-items:center;justify-content:center}
.fleche-petite{width:18px;height:18px;margin-top:13px;color:var(--argile)}
.argent{display:flex;align-items:flex-start;margin:12px 16px 0;padding:10px 12px;border-radius:16px;background:var(--lin);font-size:15px;line-height:20px;font-weight:600}
.argent .ico{margin-right:10px;color:var(--vert)}
.zone-envoi{margin:16px 16px 0}
.petit-code .qr{max-width:160px}
.titre-carte.petit{font-size:16px;font-weight:700}
.titre-carte.petit .ico{width:24px;height:24px}
.bloc-en-cause{margin:4px -8px;padding:4px 8px 10px;border:2px solid var(--orange);border-radius:16px;background:var(--orange-clair)}
.phrase-en-cause{margin:2px 0 0;font-size:17px;line-height:22px;font-weight:800}
.ligne.grisee{opacity:.55}
.ligne.grisee .mini{filter:grayscale(1)}
.ticket{display:flex;align-items:center}
.rond-numero{flex:none;width:80px;height:80px;border-radius:40px;background:var(--encre);color:var(--ivoire);font-size:44px;line-height:80px;font-weight:800;text-align:center;margin-right:14px}
.rond-numero.petit{width:48px;height:48px;font-size:24px;line-height:48px}
.ticket-texte{display:flex;flex-direction:column;min-width:0}
.ticket-titre{font-size:20px;line-height:24px;font-weight:800}
.ticket-date{margin-top:2px;font-size:15px;font-weight:600;color:var(--encre-douce)}
.etapes{display:flex;justify-content:space-between;margin:14px 16px 0}

   * Sur le chemin en ligne (D85), il dit aussi ce qui part à la boutique et au serveur.

  function information(cat) {
    return R.informationVitrine(cat ? sansCoche(cat.boutique) : '', cat && cat.whatsapp ? F.formaterWhatsApp(cat.whatsapp) : '', !!etat.ligne);

  /** Dans le navigateur de TikTok ou de Facebook : WhatsApp s'ouvre mal, on propose Chrome. */

  // ------------------------------------------------------------ le panier du client, gardé 24 h

  var etat = {
    cat: null, contenu: '', hash: null, panier: null, vue: '', tuiles: {}, barre: null, defile: 0, repris: false, texteJour: '', photos: {},
    // La vitrine en ligne (D85).
    ligne: null, serveur: null, code: '', origine: 'carre', envoi: null, touche: false, refaire: null, changements: [],
    retourChrome: null, brouillon: null, erreurChamp: null, changerClient: false, pays: null, refusLignes: {}, cause: '',
    lent: false, horsLigne: false, relecture: false, garder: false, annuler: '', signature: '', envoiEnVol: null,
    repriseEnvoi: false, dejaVendu: false, catLien: null, champs: null,

  // ------------------------------------------------------------ les petites photos (D54)

  var origineRestreinte = null;
  // Une seconde règle de sécurité resserre les images (et, sur le chemin en ligne, les appels) à
  // l'origine du serveur de CE catalogue.
  function restreindreImages(origine, appels) {
    if (origine === origineRestreinte) return;
    if (origineRestreinte !== null) {

    }

  }
  /** L'adresse de la petite photo d'un article : du catalogue (D54), ou du serveur (chemin en ligne). */
  function adressePhotoDe(a) {
    if (a.photoNom && Res) return Res.adressePhoto(etat.serveur, a.photoNom);
    return etat.cat && etat.cat.photos ? F.adresseMiniature(etat.cat, a) : null;
  }
  // Une image par adresse, gardée d'un dessin à l'autre ; si elle ne vient pas, le numéro en grand.
  function photoDe(a) {
    var adresse = adressePhotoDe(a);
    if (!adresse) return null;
    var p = etat.photos[adresse];
    if (p) return p;
    p = { img: null, etat: 'attente' };
    // `loading` avant `src` : posé après, Firefox et Safari ont déjà lancé le chargement.
    p.img = h('img', {
      class: 'photo', loading: 'lazy', decoding: 'async', alt: '', width: '320', height: '320', src: adresse,
      onload: function () {

      onerror: function () {
        p.etat = 'echec';

        if (plaque) {

  }
  /** Une petite image (une ligne de panier, le dernier panier), ou le numéro dans un carré ; et la quantité en pastille. */
  function vignette(numero, quantite, photoNom) {
    var adresse = photoNom && Res ? Res.adressePhoto(etat.serveur, photoNom) : null;
    return h('span', { class: 'vignette' }, [
      adresse ? h('img', { class: 'mini', loading: 'lazy', alt: '', src: adresse }) : h('span', { class: 'mini sans' }, ['n°' + numero]),
      quantite ? h('span', { class: 'fois' }, ['×' + quantite]) : null,
    ]);
  }

  function cleStockage() {
    return STOCKAGE + hexa8(etat.cat.cle);
  }
  function tirerDemande() {
    var o = new Uint8Array(4);
    try { window.crypto.getRandomValues(o); } catch (e) {
      for (var i = 0; i < 4; i++) o[i] = Math.floor(Math.random() * 256);
    }
    return Array.prototype.map.call(o, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function nouveauPanier() {
    return { t: Date.now(), demande: tirerDemande(), q: {}, prenom: '', montre: '' };
  }
  /**
   * Le panier gardé ici s'il a moins de 24 h, sinon un nouveau. Aussi les numéros absents de ce
   * catalogue (le QR du comptoir n'en porte qu'une partie). `montre` : les lignes déjà montrées.
   */
  function chargerPanier() {
    var p = lire(cleStockage());
    var maintenant = Date.now();
    if (!p || typeof p !== 'object' || typeof p.t !== 'number' || maintenant - p.t > DUREE_PANIER || p.t > maintenant + 60000 ||
      typeof p.demande !== 'string' || !/^[0-9a-f]{8}$/.test(p.demande) || !p.q || typeof p.q !== 'object') return nouveauPanier();
    var q = {};
    Object.keys(p.q).slice(0, F.BORNES.articles).forEach(function (k) {
      var n = p.q[k];
      if (/^[1-9][0-9]{0,4}$/.test(k) && Number.isInteger(n) && n > 0) q[k] = Math.min(n, F.BORNES.quantite);
    });
    return {
      t: p.t, demande: p.demande, q: q, montre: typeof p.montre === 'string' ? p.montre : '',
      prenom: typeof p.prenom === 'string' ? F.nettoyerTexte(p.prenom, F.BORNES.prenom) : '',
    };
  }
  function empreinte(l) {
    return l.map(function (x) { return x.numero + 'x' + x.quantite; }).join(',');
  }

    etat.panier.t = Date.now();

  }
  /** Les paniers montrés par ce téléphone (leur identifiant) : rouvert ici, un panier n'est pas reçu. */
  function faits() {
    var f = lire(STOCKAGE + 'faits');
    return Array.isArray(f) ? f : [];
  }
  function noterFait(d) {
    ecrire(STOCKAGE + 'faits', faits().filter(function (x) { return x !== d; }).concat(d).slice(-50));
  }
  /**
   * Les lignes du panier. Sur le chemin en ligne, sans les articles à prix demandé (ils ne se
   * commandent pas en ligne) et 99 au plus par ligne, comme le serveur.

  function lignes() {
    var l = F.lignesDuPanier(etat.cat, etat.panier.q);

  }
  function articleDe(numero) {
    return etat.cat.articles.filter(function (x) { return x.numero === numero; })[0] || null;
  }
  /** Le plus grand nombre que « + » accepte : sur le chemin en ligne, ce qui reste quand il en reste 1 à 3. */
  function maxDe(numero) {
    if (!etat.ligne) return F.BORNES.quantite;
    var a = articleDe(numero);
    return Math.min(B.quantite, a && a.reste > 0 ? a.reste : B.quantite);
  }
  function changer(numero, ecart) {
    var avant = lignes().length >= F.BORNES.lignes;
    var q = (etat.panier.q[numero] || 0) + ecart;
    if (q <= 0) delete etat.panier.q[numero];
    else if (q <= maxDe(numero)) {
      if (!etat.panier.q[numero] && avant) {
        parler(F.BORNES.lignes + ' articles différents au plus dans un panier.');
        vibrer();
        return;
      }
      etat.panier.q[numero] = q;
    }
    garder();
    // Le panier vient de se remplir, ou d'avoir de nouveau de la place : tous les « + » changent.
    if (avant !== (lignes().length >= F.BORNES.lignes)) Object.keys(etat.tuiles).forEach(function (n) { majTuile(+n); });

  }

  // ------------------------------------------------------------ la vitrine

  function tuile(a) {
    var q = etat.panier.q[a.numero] || 0;
    var fini = a.niveau === 'epuise';
    var plein = !q && lignes().length >= F.BORNES.lignes;
    var etiquettes = { disponible: ['coche', 'Disponible'], bientot_fini: ['alerte', 'Bientôt fini'], epuise: ['epuise', 'Épuisé'] };
    var etiquette = etat.ligne && a.reste > 0 && !fini ? ['alerte', 'Plus que ' + a.reste] : etiquettes[a.niveau];
    var compteur = null;
    if (etat.ligne && a.prix === 0) {
      // Prix demandé : il ne se commande pas en ligne ; on le demande à la boutique (D85).
      var wa = etat.cat.whatsapp;
      compteur = h('div', { class: 'compteur' }, [wa
        ? h('a', { class: 'bouton neutre petit large', rel: 'noopener noreferrer', href: F.lienWhatsApp(wa, 'Bonjour, quel est le prix du n° ' + a.numero + ' ?') }, [icone('whatsapp'), 'Demander le prix'])
        : h('span', { class: 'prix-boutique' }, ['Prix en boutique'])]);
    } else if (!fini && q === 0) {
      compteur = h('div', { class: 'compteur' }, [
        h('button', { class: 'pas plus large' + (plein ? ' plein' : ''), 'aria-label': 'Ajouter le ' + a.numero, onclick: function () { changer(a.numero, 1); } }, [icone('plus')]),
      ]);
    } else if (!fini) {

        h('button', { class: 'pas moins', 'aria-label': 'Un de moins', onclick: function () { changer(a.numero, -1); } }, [icone('moins')]),
        h('span', { class: 'qte' + (q >= 100 ? ' tres-long' : q >= 10 ? ' long' : ''), 'aria-live': 'polite' }, [String(q)]),
        h('button', { class: 'pas plus', 'aria-label': 'Un de plus', disabled: q >= maxDe(a.numero), onclick: function () { changer(a.numero, 1); } }, [icone('plus')]),
      ]);

        h('span', { class: 'numero' + (a.numero >= 10000 ? ' tres-long' : a.numero >= 1000 ? ' long' : '') }, [h('span', { class: 'no' }, ['n°']), String(a.numero)]),
        h('span', { class: 'etiquette ' + a.niveau }, [icone(etiquette[0]), etiquette[1]]),

  function texteVitrine() {

  /** Le panier déjà montré, retrouvé en rouvrant la page : il a peut-être été vendu. */

  // ------------------------------------------------------------ le panier, à montrer ou à envoyer

  function valider() {

        }, [icone('whatsapp'), 'Envoyer sur WhatsApp']));

  }

  // ------------------------------------------------------------ un panier reçu (#p=) : chez le commerçant

  function vuePanierRecu(panier, contenu) {
    etat.vue = 'recu';
    app.className = '';
    app.textContent = '';

      h('p', { class: 'note' }, ['Prix vus par le client. Le prix de la vente, c’est le vendeur qui le décide.']),
    ])));
    if (appli) app.appendChild(h('div', { style: 'margin:12px 16px 0' }, [
      h('button', { class: 'bouton valider large geant', onclick: ouvrir }, [logo(), 'Ouvrir dans SigmaMarket']),

  // ------------------------------------------------------------ erreurs

  function vueErreur(code) {
    arreterSuivi();
    etat.vue = 'erreur';
    app.className = '';
    app.textContent = '';
    var textes = {
      pas_un_lien: ['code', 'Vitrine', 'Scanne le code de la boutique pour voir ses articles.'],
      version_inconnue: ['lien', 'Lien trop récent', 'Ce lien vient d’une version plus récente. Recharge la page.'],
      suivi: ['lien', 'Ton panier', 'Ce suivi ne s’ouvre pas ici. Rouvre le lien de la boutique.'],
    };
    var t = textes[code] || ['lien', 'Ce lien est abîmé', 'Demande au vendeur de te renvoyer le lien de sa boutique.'];
    app.appendChild(entete('Vitrine', 'sac', null, t[1] + '. ' + t[2]));
    app.appendChild(h('div', { class: 'erreur' }, [
      h('div', { class: 'rond-erreur' + (code === 'pas_un_lien' ? ' neutre' : '') }, [icone(t[0])]),
      h('h1', {}, [t[1]]),
      h('p', {}, [t[2]]),
    ]));
    app.appendChild(piedDePage(null));
  }

  // ============================================================ la vitrine en ligne (D85)
  //
  // Le chemin se choisit à l'ouverture, une fois : un catalogue en version 3 porte le code de la
  // vitrine ; la page demande au serveur (vitrine_voir) si la boutique reçoit. Réponse en 5 s, et
  // elle reçoit : « Commander », puis « Envoyer à … ». Sinon le parcours d'aujourd'hui (« Valider »,
  // le code, WhatsApp), sans un mot sur le serveur. Une réponse tardive ne change rien à la visite.
  // Le contrat : docs/COMMANDE-DIRECTE-CONTRAT.md.

  function fetcher(u, i) {
    return window.fetch(u, i);
  }
  function aLeReseau() {
    return navigator.onLine !== false;
  }
  function visible() {
    return document.visibilityState !== 'hidden';
  }
  /** L'heure du serveur, d'après le dernier écart mesuré. */
  function maintenantServeur() {
    return Date.now() + (etat.envoi && etat.envoi.ecart ? etat.envoi.ecart : etat.ligne ? etat.ligne.ecart : 0);
  }
  function nomBoutique() {
    var p = etat.envoi && etat.envoi.panier;
    var nom = p && p.boutique && p.boutique.nom ? p.boutique.nom : etat.cat ? etat.cat.boutique : '';
    return sansCoche(F.nettoyerTexte(String(nom || ''), F.BORNES.nomBoutique));
  }
  function whatsappBoutique() {
    var p = etat.envoi && etat.envoi.panier;
    if (p && p.boutique) return Res.numeroWhatsApp(p.boutique.whatsapp);
    return etat.ligne && etat.cat ? etat.cat.whatsapp : null;
  }
  function majuscule(t) {
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  /** Le nom d'un article dans une phrase : « Il ne reste que 1 savon. » */
  function nomDans(x) {
    var nom = sansCoche(String(x.nom || ''));
    if (!nom) return 'article n° ' + x.numero;
    return /^.[a-zà-ÿ]/.test(nom) ? nom.charAt(0).toLowerCase() + nom.slice(1) : nom;
  }

  // ------------------------------------------------------------ ce que le navigateur garde (§ 9 du contrat)

  /** Le client : son prénom et son numéro, 30 jours au plus, avec « Oublier ». */
  function lireClient() {
    var c = lire(STOCKAGE + 'client');
    var t = Date.now();
    if (!c || typeof c !== 'object' || typeof c.jusqua !== 'number' || c.jusqua <= t || typeof c.le !== 'number' || c.le > t + 60000) return null;
    if (typeof c.telephone !== 'string' || !/^[1-9][0-9]{7,14}$/.test(c.telephone)) return null;
    return {
      prenom: typeof c.prenom === 'string' ? F.nettoyerTexte(c.prenom, B.prenom) : '',
      telephone: c.telephone,
      pays: typeof c.pays === 'string' && N.estCode && N.estCode(c.pays) ? c.pays : null,
    };
  }
  function garderClient(prenom, telephone, pays) {
    var t = Date.now();
    ecrire(STOCKAGE + 'client', { prenom: prenom, telephone: telephone, pays: pays, le: t, jusqua: t + B.souvenirClientMs });
  }

  /**
   * L'envoi en cours pour cette vitrine : l'identifiant et le jeton tirés AVANT tout appel, les lignes,
   * l'état (« pret » : montré, pas encore envoyé ; « envoi » ; « secours » : deux échecs ; « envoye »)
   * et ce que le serveur en a dit. Oublié à la fin du panier ; jamais gardé plus de 3 jours.
   */
  function lireEnvoi(code) {
    var e = lire(STOCKAGE + 'envoi.' + code);
    var t = Date.now();
    if (!e || typeof e !== 'object' || e.code !== code || typeof e.demande !== 'string' || !/^[0-9a-f]{8}$/.test(e.demande) ||
      typeof e.jeton !== 'string' || !/^[0-9a-f]{64}$/.test(e.jeton) || ['pret', 'envoi', 'secours', 'envoye'].indexOf(e.etat) < 0 ||
      !Array.isArray(e.lignes) || typeof e.t !== 'number' || t - e.t > DUREE_ENVOI || e.t > t + 60000) return null;
    e.lignes = e.lignes.filter(function (x) {
      return x && Number.isInteger(x.numero) && x.numero >= 1 && x.numero <= F.BORNES.numero && Number.isInteger(x.quantite) &&
        x.quantite >= 1 && x.quantite <= B.quantite && Number.isInteger(x.prixVu) && x.prixVu >= 0;
    }).slice(0, B.lignes);
    if (e.etat !== 'envoye' && !e.lignes.length) return null;
    return e;
  }
  function garderEnvoi(e) {
    ecrire(STOCKAGE + 'envoi.' + e.code, e);
  }
  function oublierEnvoi(e) {
    effacer(STOCKAGE + 'envoi.' + e.code);
  }

  /** Les 3 derniers paniers finis de cette boutique : leurs lignes seulement, 30 jours, avec « Oublier ». */
  function cleDerniers(cle) {
    return STOCKAGE + 'derniers.' + hexa8(cle);
  }
  function lireDerniers(cle) {
    var d = lire(cleDerniers(cle));
    var t = Date.now();
    if (!Array.isArray(d)) return [];
    return d.filter(function (x) {
      return x && typeof x.le === 'number' && t - x.le < B.souvenirClientMs && x.le <= t + 60000 && Array.isArray(x.lignes) && x.lignes.length > 0;
    }).slice(0, B.derniersPaniersGardes);
  }
  /** Un panier servi depuis moins de 30 minutes : encore suivi (une vente défaite le rend). */
  function suiviApresServi(e) {
    var p = e && e.panier;
    return !!p && p.etat === 'vendu' && typeof p.fini_le === 'number' && Date.now() + (e.ecart || 0) - p.fini_le < SUIVI_APRES_SERVI;
  }
  /** Un panier servi qui revient (la vente défaite) : il quitte les derniers paniers. */
  function retirerDernier(p) {
    if (!p || !p.boutique) return;
    var d = lireDerniers(p.boutique.cle);
    var reste = d.filter(function (x) { return x.numero !== p.numero || x.cree !== p.cree_le; });
    if (reste.length !== d.length) ecrire(cleDerniers(p.boutique.cle), reste);
  }
  function rangerDernier(e) {
    var p = e.panier;
    if (!p || !p.boutique) return;
    // Les lignes seulement (et de quoi dire « servi le 20 oct. ») : ni identifiant, ni jeton, ni numéro de téléphone.
    var d = lireDerniers(p.boutique.cle).filter(function (x) { return x.numero !== p.numero || x.cree !== p.cree_le; });
    d.unshift({
      numero: p.numero, cree: p.cree_le, etat: p.etat, motif: p.motif, fini: p.fini_le || Date.now(), le: Date.now(),
      lignes: p.lignes.slice(0, B.lignes).map(function (l) {
        return { numero: l.numero, quantite: l.quantite, nom: String(l.nom || '').slice(0, 24), prix: l.prix_unitaire, fin: l.fin };
      }),
    });
    ecrire(cleDerniers(p.boutique.cle), d.slice(0, B.derniersPaniersGardes));
  }

  // ------------------------------------------------------------ choisir le chemin

  /** Le serveur d'un catalogue en version 3 : celui qu'il porte, s'il est permis, avec la clé publique. */
  function serveurDuCatalogue(cat) {
    if (!Res || !cat.enLigne || !cat.photos) return null;
    var url = F.urlDuServeur(cat.photos.serveur);
    return url === null ? null : Res.serveurEnLigne(url);
  }
  function enLignePossible() {
    return !!Res && typeof window.fetch === 'function' && Res.peutTirer();
  }

  /** Vrai le temps d'aller à la vitrine depuis le suivi (« Voir la vitrine », « Refaire ») : le suivi ne repasse pas devant. */
  var versLaVitrine = false;

  function choisirChemin(cat) {
    var voulu = versLaVitrine;
    versLaVitrine = false;
    var serveur = serveurDuCatalogue(cat);
    if (serveur === null || !enLignePossible()) { vitrineSansServeur(); return; }
    etat.serveur = serveur;
    etat.code = cat.enLigne.code;
    etat.origine = cat.enLigne.origine;
    ecrire(STOCKAGE + 'catalogue.' + etat.code, { c: etat.contenu, le: Date.now() });
    restreindreImages(serveur.url, true);
    if (etat.retourChrome) adopterRetourChrome();
    // Un panier envoyé et pas fini : son suivi d'abord, « Voir la vitrine » en bas.
    var suivis = lireSuivis(etat.code).filter(function (x) { return !x.panier || !Res.estFini(x.panier.etat); });
    if (suivis.length && !voulu) { etat.envoi = suivis[0]; vueSuivi(); relire(); return; }
    if (!aLeReseau()) { vitrineSansServeur(); return; }
    vueAttente();
    Res.voir(fetcher, serveur, etat.code, null).then(function (r) {
      if (etat.vue !== 'attente') return;
      if (!recevoirVue(r)) { vitrineSansServeur(); return; }
      if (etat.refaire) { appliquerRefaire(); return; }
      var envoi = lireEnvoi(etat.code);
      if (envoi && envoi.etat === 'envoi') {
        // Parti pendant l'envoi : la page reprend l'état « en cours » (le même identifiant, le même jeton) et le dit.
        etat.envoi = envoi;
        etat.repriseEnvoi = true;
        parler('Ton panier était en cours d’envoi. On continue.');
        essayer(1);
        return;
      }
      if (envoi && envoi.etat === 'secours') {
        // Deux échecs, ou rouvert dans Chrome : le secours, sans nouvel essai tout seul.
        etat.envoi = envoi;
        etat.cause = 'serveur';
        vueTonPanier();
        return;
      }
      vueVitrineEnLigne();
    }, function () {
      if (etat.vue === 'attente') vitrineSansServeur();
    });
  }

  /** La réponse de vitrine_voir : la vitrine qui reçoit, ses articles et leurs prix, ceux du serveur. */
  function recevoirVue(r) {
    if (!r || r.ok !== true || r.inchange !== false || !r.vitrine || typeof r.vitrine !== 'object' || !Array.isArray(r.articles)) return false;
    var v = r.vitrine;
    if (!Number.isInteger(v.cle) || v.cle < 0 || v.cle > 0xffffffff) return false;
    var vus = {};
    var articlesEnLigne = [];
    r.articles.slice(0, F.BORNES.articles).forEach(function (a) {
      if (!a || !Number.isInteger(a.numero) || a.numero < 1 || a.numero > F.BORNES.numero || vus[a.numero]) return;
      if (!Number.isInteger(a.prix) || a.prix < 0 || a.prix > B.totalMax) return;
      if (['epuise', 'bientot_fini', 'disponible'].indexOf(a.niveau) < 0) return;
      vus[a.numero] = true;
      var x = { numero: a.numero, nom: F.nettoyerTexte(String(a.nom || ''), F.BORNES.nomArticle), prix: a.prix, niveau: a.niveau };
      if (Number.isInteger(a.reste) && a.reste >= 1 && a.reste <= 3) x.reste = a.reste;
      if (typeof a.photo === 'string') x.photoNom = a.photo;
      articlesEnLigne.push(x);
    });
    etat.ligne = {
      ecart: typeof r.maintenant === 'number' ? r.maintenant - Date.now() : 0,
      etiquette: r.etiquette,
      prixLe: typeof v.prix_le === 'number' ? v.prix_le : null,
      servis: Number.isInteger(v.paniers_servis) && v.paniers_servis >= B.servisMontresDes ? v.paniers_servis : null,
      servisDepuis: typeof v.servis_depuis === 'string' ? v.servis_depuis : null,
    };
    // Le nom et le WhatsApp viennent du serveur, jamais de l'adresse : un lien fabriqué avec le vrai
    // code et le numéro d'un escroc n'envoie personne chez l'escroc.
    etat.catLien = etat.cat;
    etat.cat = {
      cle: v.cle, jour: aujourdhui(), boutique: F.nettoyerTexte(String(v.nom || ''), F.BORNES.nomBoutique),
      whatsapp: Res.numeroWhatsApp(v.whatsapp), articles: articlesEnLigne, photos: null,
    };
    etat.panier = chargerPanier();
    return true;
  }

  function vueAttente() {
    etat.vue = 'attente';
    app.className = '';
    app.textContent = '';
    var nom = sansCoche(etat.cat.boutique) || 'Vitrine';
    document.title = nom;
    app.appendChild(entete(nom, 'sac', null, nom + '. Un instant.'));
    app.appendChild(h('div', { class: 'attente' }, [h('span', { class: 'anneau', 'aria-hidden': 'true' }), 'Un instant…']));
  }

  /** Rouvert dans Chrome par le lien du secours : le panier et son jeton sont rangés, pas gardés dans l'adresse. */
  function adopterRetourChrome() {
    var rc = etat.retourChrome;
    etat.retourChrome = null;
    var lu;
    try { lu = F.lireAdresse('#p=' + rc.p); } catch (e) { return; }
    if (lu.type !== 'panier' || lu.panier.cle !== etat.cat.cle) return;
    var deja = lireEnvoi(etat.code);
    if (deja && deja.jeton === rc.j) return;
    var noms = {};
    etat.cat.articles.forEach(function (a) { noms[a.numero] = a.nom; });
    garderEnvoi({
      code: etat.code, cle: etat.cat.cle, demande: lu.panier.demande, jeton: rc.j, etat: 'secours', t: Date.now(), panier: null,
      lignes: lu.panier.lignes.filter(function (x) { return x.quantite <= B.quantite; }).map(function (x) {
        return { numero: x.numero, quantite: x.quantite, prixVu: x.prixVu, nom: noms[x.numero] || '' };
      }),
    });
  }

  // ------------------------------------------------------------ la vitrine en ligne

  function texteServis() {
    var L = etat.ligne;
    if (L.servis === null) return '';
    var mois = Res.moisDepuis(L.servisDepuis, maintenantServeur());
    return L.servis + ' paniers servis' + (mois ? ' depuis ' + mois : '');
  }
  /** « Prix de 9 h 30 », « Prix d'hier, 18 h 10 », ou plus vieux, en orange. */
  function textePrix() {
    var L = etat.ligne;
    if (L.prixLe === null) return { texte: '', vieux: false };
    var j = Res.joursEntre(L.prixLe, maintenantServeur());
    if (j <= 0) return { texte: 'Prix de ' + Res.heure(L.prixLe), vieux: false };
    if (j === 1) return { texte: 'Prix d’hier, ' + Res.heure(L.prixLe), vieux: false };
    return { texte: 'Prix du ' + Res.date(L.prixLe) + ' : ils ont pu changer', vieux: true };
  }

  function vueVitrineEnLigne() {
    var cat = etat.cat;
    arreterSuivi();
    etat.vue = 'vitrine';
    etat.tuiles = {};
    etat.envoi = null;
    etat.changements = [];
    etat.refusLignes = {};
    etat.dejaVendu = false;
    var nom = sansCoche(cat.boutique) || 'Vitrine';
    document.title = nom;
    app.className = 'avec-barre';
    app.textContent = '';
    var servis = texteServis();
    var prix = textePrix();
    etat.texteJour = (servis ? servis + '. ' : '') + (prix.texte ? prix.texte + '. ' : '');
    app.appendChild(entete(nom, 'sac', null, texteVitrine));
    var derniers = lireDerniers(cat.cle);
    if (derniers.length) app.appendChild(carteDernier(derniers[0]));
    // Sans bandeau devant les articles : une seule ligne, et seulement ce qui est vrai.
    if (servis || prix.texte) {
      app.appendChild(h('div', { class: 'bandeau' + (prix.vieux ? ' vieux' : '') }, [
        servis ? h('div', { class: 'rang' }, [icone('panier'), servis]) : null,
        prix.texte ? h('div', { class: 'rang' }, [icone('horloge'), prix.texte]) : null,
      ]));
    }
    app.appendChild(grilleDesArticles());
    app.appendChild(piedEnLigne());
    etat.barre = barre();
    app.appendChild(etat.barre);
  }

  /** Le petit texte du bas, sans bandeau d'alerte : l'avertissement en gris, « Signaler cette boutique ». */
  function piedEnLigne() {
    var nom = nomBoutique();
    var wa = whatsappBoutique();
    var tel = R.TELEPHONE_EDITEUR && R.TELEPHONE_EDITEUR.charAt(0) === '+' ? R.TELEPHONE_EDITEUR.replace(/\D/g, '') : '';
    var signaler = tel.length >= 8
      ? F.lienWhatsApp(tel, 'Bonjour, je signale la boutique « ' + nom + ' » (vitrine ' + etat.code + ').')
      : R.PAGE_DONNEES;
    return h('div', {}, [
      h('p', { class: 'pied-garde' }, [GARDE + ' ', h('a', { href: signaler, rel: 'noopener noreferrer' }, ['Signaler cette boutique'])]),
      wa ? h('p', { class: 'pied-page' }, ['Numéro de la boutique : ' + numeroBoutique(wa) + '.']) : null,
      h('p', { class: 'pied-info' }, [R.informationVitrine(nom, wa ? F.formaterWhatsApp(wa) : '', true) + ' ', h('a', { href: R.PAGE_DONNEES }, ['Tes données'])]),
    ]);
  }

  function motFin(d) {
    if (d.etat === 'vendu') return 'servi le ';
    if (d.etat === 'refuse') return 'refusé le ';
    if (d.etat === 'expire') return 'sans réponse le ';
    return 'annulé le ';
  }
  /** « Ton dernier panier : servi le 20 oct. », ses photos, et « Refaire ce panier ». */
  function carteDernier(d) {
    var photos = {};
    etat.cat.articles.forEach(function (a) { photos[a.numero] = a.photoNom; });
    return h('div', { class: 'carte dernier' }, [
      h('div', { class: 'rang-titre' }, [icone('panier'), 'Ton dernier panier : ' + motFin(d) + Res.date(d.fini)]),
      h('div', { class: 'rang-dernier' }, [
        h('span', { class: 'vignettes' }, d.lignes.slice(0, 3).map(function (l) { return vignette(l.numero, l.quantite, photos[l.numero]); })),
        h('button', { class: 'bouton valider', onclick: function () { refaire(d.lignes, []); } }, [icone('recommencer'), 'Refaire ce panier']),
      ]),
      h('button', { class: 'lien-discret', onclick: function () { effacer(cleDerniers(etat.cat.cle)); vueVitrineEnLigne(); } }, ['Oublier mes derniers paniers']),
    ]);
  }

  /**
   * « Refaire ce panier » : les mêmes articles, aux prix et au stock du jour ; ce qui a changé est dit
   * en orange sur « Ton panier ». `sauf` : les numéros à laisser (refusés : il n'y en avait plus).
   */
  function refaire(lignesAvant, sauf) {
    etat.refaire = { lignes: lignesAvant, sauf: sauf || [] };
    if (etat.ligne && etat.vue === 'vitrine') { appliquerRefaire(); return; }
    revenirALaVitrine();
  }
  function appliquerRefaire() {
    var r = etat.refaire;
    etat.refaire = null;
    etat.panier = nouveauPanier();
    etat.changements = [];
    r.lignes.forEach(function (l) {
      if (r.sauf.indexOf(l.numero) >= 0) return;
      var a = articleDe(l.numero);
      var nom = nomDans({ numero: l.numero, nom: a ? a.nom : l.nom });
      if (!a || a.niveau === 'epuise' || (etat.ligne && a.prix === 0)) { etat.changements.push('Plus ' + Res.de(nom) + '.'); return; }
      var q = Math.min(l.quantite, maxDe(l.numero));
      if (q < l.quantite) etat.changements.push('Il ne reste que ' + q + ' ' + nom + '.');
      if (l.prix && l.prix !== a.prix) etat.changements.push(majuscule(nom) + ' est passé à ' + F.formaterNombre(a.prix) + ' F.');
      etat.panier.q[l.numero] = q;
    });
    garder();
    if (!etat.ligne) { vueVitrine(); return; }
    if (!lignes().length) {
      var dits = etat.changements.join(' ');
      vueVitrineEnLigne();
      parler(dits);
      return;
    }
    commander();
  }
  /** Retour à la vitrine : le lien de la boutique, ou (suivi ouvert d'ailleurs) celui gardé pour ce code. */
  function revenirALaVitrine() {
    arreterSuivi();
    var gardee = etat.code ? lire(STOCKAGE + 'catalogue.' + etat.code) : null;
    var contenu = etat.contenu || (gardee && typeof gardee.c === 'string' ? gardee.c : '');
    if (!contenu) { vueErreur('suivi'); return; }
    versLaVitrine = true;
    try { history.pushState(null, '', adressePage() + '#c=' + contenu); } catch (e) { /* rien */ }
    demarrer();
  }
  /** Le parcours d'aujourd'hui ; un « Refaire » demandé s'y applique aussi (aux prix du catalogue). */
  function vitrineSansServeur() {
    if (etat.refaire) appliquerRefaire();
    else vueVitrine();
  }

  // ------------------------------------------------------------ « Ton panier » (en ligne)

  /** Les lignes telles qu'elles partent : nom et photo pour la page, prix vus pour le QR et WhatsApp. */
  function lignesEnvoi() {
    return lignes().map(function (x) {
      var a = articleDe(x.numero);
      return { numero: x.numero, quantite: x.quantite, prixVu: x.prixVu, nom: a ? a.nom : '', photo: a && a.photoNom ? a.photoNom : null };
    });
  }
  function totalDe(l) {
    return l.reduce(function (s, x) { return s + x.quantite * x.prixVu; }, 0);
  }
  /**
   * L'identifiant et le jeton : tirés AVANT tout appel, gardés avec les lignes. Les mêmes lignes
   * gardent la même paire ; d'autres lignes en tirent une nouvelle (et l'ancienne, peut-être arrivée
   * au serveur sans réponse, est annulée sans attendre : pas de panier fantôme).
   */
  function preparerEnvoi() {
    var l = lignesEnvoi();
    // Un envoi encore en route (le client est revenu à la vitrine pendant ce temps) : le même.
    var enVol = etat.envoiEnVol;
    if (enVol && enVol.code === etat.code && empreinte(enVol.lignes) === empreinte(l)) return enVol;
    var e = lireEnvoi(etat.code);
    if (e && e.etat !== 'envoye' && empreinte(e.lignes) === empreinte(l)) {
      e.lignes = l;
      // Parti sans réponse : la même paire repart au prochain « Envoyer » (le serveur ne la compte pas deux fois).
      if (e.etat === 'envoi') e.etat = 'pret';
      return e;
    }
    if (e && (e.etat === 'envoi' || e.etat === 'secours')) annulerPlusTard(e.jeton);
    var paire = Res.tirerPaire();
    etat.panier.demande = paire.demande;
    etat.panier.montre = empreinte(l);
    garder();
    noterFait(paire.demande);
    e = { code: etat.code, cle: etat.cat.cle, demande: paire.demande, jeton: paire.jeton, etat: 'pret', t: Date.now(), lignes: l, panier: null };
    garderEnvoi(e);
    return e;
  }
  /**
   * Les paniers peut-être arrivés au serveur sans réponse, puis remplacés (d'autres lignes) ou
   * abandonnés : leur annulation repart à chaque occasion (un envoi, le retour du réseau, l'ouverture
   * de la page) jusqu'à ce que le serveur l'ait prise (annulé, inconnu, ou déjà en main à la
   * boutique). Sinon un panier fantôme restait au comptoir : il sonnait, réservait ses articles, et le
   * client ne pouvait plus ni le voir ni l'annuler. Gardés 3 jours au plus, 10 au plus.
   */
  var CLE_A_ANNULER = STOCKAGE + 'a_annuler';
  function aAnnuler() {
    var l = lire(CLE_A_ANNULER);
    var t = Date.now();
    if (!Array.isArray(l)) return [];
    return l.filter(function (x) {
      return x && typeof x.jeton === 'string' && /^[0-9a-f]{64}$/.test(x.jeton) && typeof x.t === 'number' && t - x.t <= DUREE_ENVOI &&
        x.serveur && typeof x.serveur.url === 'string' && typeof x.serveur.cle === 'string';
    }).slice(-10);
  }
  function annulerPlusTard(jeton) {
    if (!etat.serveur) return;
    var l = aAnnuler().filter(function (x) { return x.jeton !== jeton; });
    l.push({ jeton: jeton, serveur: etat.serveur, t: Date.now() });
    ecrire(CLE_A_ANNULER, l.slice(-10));
    annulerEnAttente();
  }
  var annulationEnCours = null;
  /** Rejoue les annulations en attente ; rend une promesse (jamais rejetée) quand c'est fait. */
  function annulerEnAttente() {
    if (annulationEnCours) return annulationEnCours;
    var l = aAnnuler();
    if (!l.length || !aLeReseau()) return Promise.resolve();
    var restants = [];
    var suite = Promise.resolve();
    l.forEach(function (x) {
      suite = suite.then(function () {
        return Res.annulerMonPanier(fetcher, x.serveur, x.jeton).then(function (r) {
          // Annulé, inconnu, ou déjà en main à la boutique (« pris ») : le serveur l'a. Sinon, plus tard.
          if (!(r && (r.ok === true || r.refus === 'panier_inconnu' || r.refus === 'pris'))) restants.push(x);
        }, function () { restants.push(x); });
      });
    });
    annulationEnCours = suite.then(function () {
      annulationEnCours = null;
      // Ce qui s'est ajouté pendant ce temps reste aussi.
      var ajoutes = aAnnuler().filter(function (x) { return !l.some(function (y) { return y.jeton === x.jeton; }); });
      var tous = restants.concat(ajoutes);
      if (tous.length) ecrire(CLE_A_ANNULER, tous);
      else effacer(CLE_A_ANNULER);
    });
    return annulationEnCours;
  }

  /** Une autre paire pour le même panier (« demande_prise ») : le QR se redessine avec elle. */
  function nouvellePaire(e) {
    var paire = Res.tirerPaire();
    e.demande = paire.demande;
    e.jeton = paire.jeton;
    etat.panier.demande = paire.demande;
    garder();
    noterFait(paire.demande);
    garderEnvoi(e);
  }

  function commander() {
    if (!lignes().length) return;
    etat.envoi = preparerEnvoi();
    etat.refusLignes = {};
    etat.erreurChamp = null;
    etat.cause = '';
    etat.defile = window.pageYOffset || 0;
    try { history.pushState({ vitrine: 'panier' }, '', location.href); } catch (e) { /* rien */ }
    vueTonPanier();
  }
  function lienDuPanier(e, prenom) {
    var octets = F.encoderPanier({
      cle: etat.cat.cle, demande: e.demande, prenom: prenom,
      lignes: e.lignes.map(function (x) { return { numero: x.numero, quantite: x.quantite, prixVu: x.prixVu }; }),
    });
    return F.versBase64url(octets);
  }
  /** Le nombre de signes d'un texte (un emoji compte pour un). */
  function signes(t) {
    return String(t).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, '_').length;
  }
  /** « Envoyer à Chez Mariam » (le nom vient du serveur) ; au-delà de 14 signes, « Envoyer à la boutique ». */
  function libelleEnvoyer() {
    var nom = nomBoutique();
    return nom && signes(nom) <= 14 ? 'Envoyer à ' + nom : 'Envoyer à la boutique';
  }
  /** « Prix de la boutique à 9 h 30. Elle te confirme le total. » : dit une fois, en positif. */
  function notePrix() {
    var L = etat.ligne;
    if (!L || L.prixLe === null) return 'Prix de la boutique. Elle te confirme le total.';
    var j = Res.joursEntre(L.prixLe, maintenantServeur());
    var quand = j <= 0 ? 'à ' + Res.heure(L.prixLe) : j === 1 ? 'd’hier, ' + Res.heure(L.prixLe) : 'du ' + Res.date(L.prixLe) + ' : ils ont pu changer';
    return 'Prix de la boutique ' + quand + '. Elle te confirme le total.';
  }
  function texteSecours() {
    var cause = etat.cause === 'reseau' ? 'Pas de réseau sur ton téléphone.' : 'L’envoi direct ne marche pas pour le moment.';
    if (!whatsappBoutique()) return cause + ' Montre ce code au vendeur.';
    return cause + (etat.origine === 'lien' ? ' Envoie ton panier sur WhatsApp, ou montre ce code.' : ' Montre ce code au vendeur, ou envoie-le sur WhatsApp.');
  }

  function vueTonPanier() {
    var e = etat.envoi;
    var cat = etat.cat;
    arreterSuivi();
    etat.vue = 'ton-panier';
    app.className = '';
    app.textContent = '';
    window.scrollTo(0, 0);
    var l = e.lignes;
    var total = totalDe(l);
    var n = F.nombreArticles(l);
    var nom = nomBoutique();
    var client = etat.changerClient ? null : lireClient();
    var secours = e.etat === 'secours';
    var prenom = F.prenomLisible(e.prenom !== undefined ? e.prenom : client ? client.prenom : '');
    var contenuPanier = lienDuPanier(e, prenom);
    var lien = adressePage() + '#p=' + contenuPanier;
    var wa = whatsappBoutique();
    var lienWa = wa ? F.lienWhatsApp(wa, F.texteWhatsApp(cat, l, prenom, lien)) : null;
    var refus = Object.keys(etat.refusLignes);
    // Au secours depuis le carré imprimé (ou sans WhatsApp), le client est sans doute au comptoir : le code d'abord.
    var codeDAbord = etat.origine !== 'lien' || !lienWa;

    app.appendChild(entete('Ton panier', 'panier', retourVitrine, function () { return texteTonPanier(e, client, secours); }));

    // Ce qui ne va pas, en haut : le secours, une ligne refusée, un prix qui a changé.
    if (secours) {
      app.appendChild(h('div', { class: 'bandeau vieux' }, [h('div', { class: 'rang' }, [icone(etat.cause === 'reseau' ? 'nuageBarre' : 'alerte'), texteSecours()])]));
    } else if (refus.length) {
      app.appendChild(h('div', { class: 'bandeau vieux' }, [h('div', { class: 'rang' }, [icone('alerte'), etat.refusLignes[refus[0]].phrase])]));
    } else if (etat.changements.length) {
      app.appendChild(h('div', { class: 'bandeau vieux' }, etat.changements.map(function (t) { return h('div', { class: 'rang' }, [icone('alerte'), t]); })));
    }
    if (etat.dejaVendu) {
      app.appendChild(h('div', { class: 'bandeau vieux' }, [
        h('div', { class: 'rang' }, [icone('alerte'), 'La boutique a déjà servi ce panier.']),
        h('button', { class: 'bouton neutre large espace', onclick: function () { etat.dejaVendu = false; nouvellePaire(e); e.etat = 'pret'; garderEnvoi(e); vueTonPanier(); } }, [icone('recommencer'), 'Refaire ce panier']),
      ]));
    }

    if (secours && codeDAbord) {
      app.appendChild(h('div', { class: 'carte' }, [h('div', { class: 'titre-carte' }, [icone('telephone'), 'Montre ce code au vendeur']), dessinQrSur(lien)]));
    }

    // Les lignes : la photo, la quantité, le prix ; une ligne refusée, en orange, avec ce qu'on peut faire.
    app.appendChild(h('div', { class: 'carte' }, l.map(function (x) { return rangeeLigne(x); }).concat([
      h('div', { class: 'total-panier' }, [h('span', { class: 'combien' }, [articles(n)]), h('span', { class: 'montant' }, [montant(total)])]),
      secours ? null : h('p', { class: 'note' }, [icone('horloge', 'petite'), notePrix()]),
    ])));

    if (secours) {
      // Rouvert dans Chrome par le lien du secours : le numéro n'y est pas encore.
      if (!client && !e.telephone) app.appendChild(blocClient(e, client, nom));
      app.appendChild(blocSecours(e, lien, lienWa, codeDAbord));
      app.appendChild(piedEnLigne());
      return;
    }

    app.appendChild(blocClient(e, client, nom));
    app.appendChild(h('div', { class: 'carte et-apres' }, [
      h('div', { class: 'titre-petit' }, ['Et après']),
      h('div', { class: 'etapes-apres' }, [
        etapeApres('boutique', 'Elle reçoit'), icone('fleche', 'fleche-petite'),
        etapeApres('appel', 'Elle confirme ou t’appelle'), icone('fleche', 'fleche-petite'),
        etapeApres('mainPiece', 'Tu paies et prends à la boutique'),
      ]),
    ]));
    app.appendChild(h('p', { class: 'argent' }, [icone('billets'), ARGENT]));

    var enCours = e.etat === 'envoi';
    app.appendChild(h('div', { class: 'zone-envoi' }, [
      h('button', {
        class: 'bouton valider large geant' + (enCours ? ' en-cours' : ''), 'aria-busy': enCours ? 'true' : null,
        onclick: function () { envoyer(); },
      }, enCours ? [h('span', { class: 'anneau', 'aria-hidden': 'true' }), 'Envoi…'] : [icone('envoyer'), libelleEnvoyer()]),
      enCours && etat.repriseEnvoi ? h('p', { class: 'note centre' }, ['Ton panier était en cours d’envoi. On continue.']) : null,
      enCours && etat.lent ? h('p', { class: 'note centre' }, ['Réseau lent, on continue. Ne ferme pas.']) : null,
    ]));
    app.appendChild(h('div', { class: 'carte petit-code' }, [
      h('div', { class: 'titre-carte petit' }, [icone('code'), 'ou montre ce code au vendeur']),
      dessinQrSur(lien),
    ]));
    app.appendChild(piedEnLigne());
  }

  function etapeApres(dessin, texte) {
    return h('span', { class: 'etape-apres' }, [h('span', { class: 'rond-etape' }, [icone(dessin)]), texte]);
  }

  /** Une ligne de « Ton panier ». Refusée par le serveur : en orange, la phrase, et les boutons qui renvoient. */
  function rangeeLigne(x) {
    var r = etat.refusLignes[x.numero];

      vignette(x.numero, x.quantite, x.photo),

    } else {
      boutons.push(h('button', { class: 'bouton valider', onclick: function () { changerLigne(x.numero, 0, true); } }, [icone('envoyer'), 'Envoyer sans ' + etiquette]));
    }

      ligne,
      h('p', { class: 'phrase-en-cause' }, [r.phrase + (r.genre === 'trop' ? ' Demande-les en boutique.' : '')]),
      h('div', { class: 'rangee' }, boutons),
    ]);
  }
  /** Une ligne changée après un refus : nouvelle paire (le QR suit), puis, si demandé, l'envoi tout de suite. */
  function changerLigne(numero, quantite, renvoyer) {
    if (quantite > 0) etat.panier.q[numero] = quantite;
    else delete etat.panier.q[numero];
    garder();
    delete etat.refusLignes[numero];
    if (!lignes().length) { etat.envoi = null; vueVitrineEnLigne(); return; }
    var e = etat.envoi;
    e.lignes = lignesEnvoi();
    nouvellePaire(e);
    e.etat = 'pret';
    garderEnvoi(e);

    else vueTonPanier();
  }

  // ------------------------------------------------------------ le prénom et le numéro

  /** Le drapeau d'un pays, dessiné d'après la liste de numero.js (cadre de 60 x 40), comme la page du live. */
  function drapeau(code) {
    var s = svg('svg', { viewBox: '0 0 60 40', preserveAspectRatio: 'none', class: 'drapeau', 'aria-hidden': 'true' });
    N.pays(code).f.forEach(function (f) {
      if (f[0] === 'r') s.appendChild(svg('rect', { x: f[1], y: f[2], width: f[3], height: f[4], fill: f[5] }));
      else if (f[0] === 'c') s.appendChild(svg('circle', { cx: f[1], cy: f[2], r: f[3], fill: f[4] }));
      else if (f[0] === 'p') s.appendChild(svg('polygon', { points: f[1], fill: f[2] }));
      else if (f[0] === 'l') s.appendChild(svg('line', { x1: f[1], y1: f[2], x2: f[3], y2: f[4], 'stroke-width': f[5], stroke: f[6] }));
      else s.appendChild(svg('polygon', { points: f[1], fill: 'none', 'stroke-width': f[2], stroke: f[3] }));
    });
    return s;
  }
  /** Le pays du numéro : celui que le client a choisi, sinon celui du WhatsApp de la boutique. */
  function paysParDefaut(client) {
    if (etat.pays) return etat.pays;
    if (client && client.pays) return client.pays;
    var p = whatsappBoutique() ? N.paysDe(whatsappBoutique()) : null;
    return p ? p.c : N.PAYS[0].c;
  }

  /**
   * La première fois : deux champs, chacun avec son étiquette au-dessus. Les fois suivantes, le prénom
   * et le numéro retenus, avec « Changer » (le crayon) et « Pas toi ? Changer » (un téléphone prêté).
   */
  function blocClient(e, client, nom) {

        h('div', { class: 'identite' }, [
          icone('personne'),
          h('span', { class: 'qui' }, [h('span', { class: 'prenom' }, [client.prenom || 'Sans prénom']), h('span', { class: 'numero-client' }, [N.formater(client.telephone)])]),
          h('button', { class: 'crayon', 'aria-label': 'Changer mon prénom ou mon numéro', onclick: function () {
            etat.brouillon = { prenom: client.prenom, telephone: N.depuis(client.telephone, paysParDefaut(client)).national };

          } }, [icone('crayon')]),
        ]),
        pourquoi,
        h('div', { class: 'rang-liens' }, [
          h('button', { class: 'lien-discret', onclick: function () { etat.changerClient = true; etat.brouillon = { prenom: '', telephone: '' }; vueTonPanier(); } }, ['Pas toi ? Changer']),
          h('button', { class: 'lien-discret', onclick: function () { effacer(STOCKAGE + 'client'); etat.brouillon = { prenom: '', telephone: '' }; vueTonPanier(); } }, ['Oublier']),
        ]),
      ]);
    }
    var brouillon = etat.brouillon || { prenom: '', telephone: '' };
    var pays = paysParDefaut(client);
    var lePays = N.pays(pays);
    var erreur = etat.erreurChamp;
    var prenom = h('input', { type: 'text', id: 'champ-prenom', maxlength: String(B.prenom), autocomplete: 'given-name', 'aria-label': 'Ton prénom' });
    prenom.value = brouillon.prenom;
    var coche = h('span', { class: 'coche-verte' + (N.analyser(brouillon.telephone, pays).etat === 'bon' ? '' : ' cache'), 'aria-hidden': 'true' }, [icone('coche')]);
    var telephone = h('input', {
      type: 'tel', id: 'champ-numero', inputmode: 'tel', autocomplete: 'tel', maxlength: String(N.CHIFFRES_MAX + 6), 'aria-label': 'Ton numéro', placeholder: N.exemple(pays),
      oninput: function () {
        etat.brouillon = { prenom: prenom.value, telephone: telephone.value };
        // La longueur, vérifiée en direct : une coche verte quand elle est bonne.
        var bon = N.analyser(telephone.value, pays).etat === 'bon';
        coche.className = 'coche-verte' + (bon ? '' : ' cache');
        if (telephone.parentNode) telephone.parentNode.className = 'champ tel' + (bon ? ' bon' : '');
      },
    });
    telephone.value = brouillon.telephone;
    prenom.addEventListener('input', function () { etat.brouillon = { prenom: prenom.value, telephone: telephone.value }; });
    etat.champs = { prenom: prenom, telephone: telephone };
    var autrePays = h('button', {
      class: 'drapeau-bouton', type: 'button',
      'aria-label': 'Pays du numéro : ' + lePays.n + ', indicatif ' + lePays.i + '. Toucher pour changer de pays',
      onclick: function () { etat.brouillon = { prenom: prenom.value, telephone: telephone.value }; vuePays(); },
    }, [drapeau(pays), h('span', { class: 'indicatif' }, ['+' + lePays.i]), icone('bas')]);

      h('div', { class: 'champ' + (erreur && erreur.champ === 'prenom' ? ' faux' : '') }, [prenom]),
      erreur && erreur.champ === 'prenom' ? h('p', { class: 'aide-erreur', role: 'alert' }, [erreur.texte]) : null,
      h('label', { class: 'etiquette-champ', for: 'champ-numero' }, [icone('appel', 'petite'), 'Ton numéro']),
      h('div', { class: 'champ tel' + (erreur && erreur.champ === 'telephone' ? ' faux' : (N.analyser(brouillon.telephone, pays).etat === 'bon' ? ' bon' : '')) }, [autrePays, telephone, coche]),
      erreur && erreur.champ === 'telephone' ? h('p', { class: 'aide-erreur', role: 'alert' }, [erreur.texte]) : null,
      pourquoi,
    ]);
  }

  /** La liste des drapeaux : chaque pays se reconnaît à son dessin, et se dit à voix haute quand on le touche. */
  function vuePays() {
    etat.vue = 'pays';
    app.className = '';
    app.textContent = '';
    app.appendChild(entete('Pays du numéro', vueTonPanier, 'Touche le drapeau du pays où ton numéro marche.'));
    app.appendChild(h('div', { class: 'carte liste-pays' }, N.PAYS.map(function (p) {

  // ------------------------------------------------------------ l'envoi

  /** « Envoyer à … » : jamais grisé. Touché trop tôt, il va au champ qui manque et le dit. */
  function envoyer() {
    var e = etat.envoi;

    if (e.etat !== 'pret' && e.etat !== 'secours') return;
    var client = etat.changerClient ? null : lireClient();
    var prenom = '';
    var telephone = '';
    var pays = paysParDefaut(client);
    if (client && !etat.brouillon) {

      telephone = client.telephone;
    } else if (!etat.brouillon && !etat.changerClient && e.telephone) {

      telephone = e.telephone;
    } else {

      if (prenom && !F.prenomLisible(prenom)) { erreurChamp('prenom', Res.texteRefus('prenom_invalide')); return; }
      var a = N.analyser(b.telephone || '', pays);
      if (a.etat === 'vide') { erreurChamp('telephone', 'Il manque ton numéro.'); return; }

  /**

  function essayer(n) {

  /**

      else if (refus === 'quantite_trop_grande') r = { genre: 'trop', phrase: 'Trop ' + Res.de(nom) + ' pour un panier.' };

  /** Les paniers envoyés de cette vitrine (3 au plus, le plus récent d'abord), gardés jusqu'à leur fin. */

      etat.relecture = false;
      if (etat.envoi !== e) return;

      // garde la dernière nouvelle, et relit moins souvent (5 minutes) au lieu de se taire.
