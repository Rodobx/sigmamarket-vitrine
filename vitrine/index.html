      etape('coche', 'Envoyé', Res.heure(p.cree_le), true),
      etape('deuxCoches', 'Reçu', recu ? Res.heure(p.recu_le) : '', recu),
      etape('panier', p.etat === 'pret' ? 'Prêt' : 'Servi', p.etat === 'pret' && p.pret_le ? Res.heure(p.pret_le) : '', p.etat === 'pret'),
    ]));
    if (p.etat === 'pris') {
      app.appendChild(h('div', { class: 'bandeau ok' }, [h('div', { class: 'rang' }, [icone('panier'), 'La boutique est en train de servir ton panier.'])]));
    } else if (p.etat === 'pret') {
      app.appendChild(h('div', { class: 'bandeau ok' }, [h('div', { class: 'rang' }, [icone('panier'), 'C’est prêt. Passe le chercher avec ton n° ' + p.numero + '.'])]));
    } else if (recu) {
      app.appendChild(h('div', { class: 'carte maintenant' }, [
        h('span', { class: 'rond-etape' }, [icone('appel')]),
        h('span', {}, [h('strong', {}, ['Et maintenant']), h('span', { class: 'bloc' }, [texteEtMaintenant(e, p)])]),
      ]));
    } else {
      if (p.delai_habituel) app.appendChild(h('p', { class: 'note marge' }, [icone('horloge', 'petite'), 'D’habitude, la boutique voit les paniers en ' + p.delai_habituel + ' min environ.']));
      // Pas encore reçu : le code en gros, pour un client déjà au comptoir.
      app.appendChild(h('div', { class: 'carte' }, [h('div', { class: 'titre-carte petit' }, [icone('telephone'), 'Au comptoir, montre ce code']), dessinQrSur(adressePage() + '#p=' + lienDuPanierVu(e, p))]));
    }
    app.appendChild(carteLignesVues(p, false));
    if (p.etat !== 'pris') {
      app.appendChild(h('p', { class: 'note marge' }, [icone('horloge', 'petite'), 'Sans réponse avant ' + Res.quand(p.expire_le, maintenantServeur()) + ', ton panier s’annule tout seul. Rien n’est dû.']));
    }
    app.appendChild(h('p', { class: 'note marge' }, ['Tu peux fermer cette page. Rouvre le lien de la boutique pour voir la réponse.']));
    var gros = prevenirGros(e);
    if (gros) app.appendChild(h('div', { class: 'bandeau vieux' }, [h('div', { class: 'rang' }, [icone('whatsapp'), 'La boutique est peut-être occupée. Préviens-la sur WhatsApp.'])]));
    var prevenir = lienPrevenir(e, p);
    app.appendChild(h('div', { class: 'rangee marge' }, [
      h('button', { class: 'bouton neutre', onclick: function () { etat.garder = !etat.garder; garderMonSuivi(e); } }, [icone('lien'), 'Garder mon suivi']),
      prevenir && !gros ? h('a', { class: 'bouton neutre', rel: 'noopener noreferrer', href: prevenir }, [icone('whatsapp'), 'Prévenir']) : null,
    ]));
    if (prevenir && gros) app.appendChild(h('div', { class: 'marge' }, [h('a', { class: 'bouton valider large geant', rel: 'noopener noreferrer', href: prevenir }, [icone('whatsapp'), 'Prévenir sur WhatsApp'])]));
    if (etat.garder) app.appendChild(blocGarder(e));
    app.appendChild(ligneMiseAJour(e));
    app.appendChild(h('p', { class: 'argent' }, [icone('billets'), ARGENT]));
    app.appendChild(autresPaniers(e));
    if (catalogueConnu()) app.appendChild(h('div', { class: 'marge' }, [h('button', { class: 'bouton neutre large', onclick: revenirALaVitrine }, [icone('sac'), 'Voir la vitrine'])]));
    if (p.etat !== 'pris' || etat.annuler === 'pris') app.appendChild(blocAnnuler(e, p));
    app.appendChild(piedEnLigne());
    programmerRelecture();
  }
  /** Le lien de la vitrine est connu ici (ouvert d'elle, ou gardé) : « Voir la vitrine » y mène. */
  function catalogueConnu() {
    var gardee = etat.code ? lire(STOCKAGE + 'catalogue.' + etat.code) : null;
    return !!etat.contenu || !!(gardee && typeof gardee.c === 'string');
  }

  function etape(dessin, nom, heure, fait) {
    return h('span', { class: 'etape' + (fait ? ' faite' : '') }, [
      h('span', { class: 'rond-coche' }, [icone(dessin)]),
      h('span', { class: 'etape-nom' }, [nom]),
      h('span', { class: 'etape-heure' }, [heure]),
    ]);
  }
  /** « Elle peut t'appeler au 07 07 … 56 : réponds, même si tu ne connais pas le numéro. Ou passe avec ton n° 4. » */
  function texteEtMaintenant(e, p) {
    var tel = e.telephone ? N.depuis(e.telephone, paysParDefaut(null)).national : '';
    var dit = tel.length >= 6 ? tel.slice(0, 2) + ' ' + tel.slice(2, 4) + ' … ' + tel.slice(-2) : '… ' + p.telephone_fin;
    return 'La boutique a ton panier. Elle peut t’appeler au ' + dit + ' : réponds, même si tu ne connais pas le numéro. Ou passe avec ton n° ' + p.numero + '.';
  }
  function lienDuPanierVu(e, p) {
    return F.versBase64url(F.encoderPanier({
      cle: p.boutique.cle, demande: p.demande, prenom: F.prenomLisible(e.prenom || p.prenom || ''),
      lignes: p.lignes.map(function (l) { return { numero: l.numero, quantite: l.quantite, prixVu: l.prix_unitaire }; }),
    }));
  }
  /** Les photos et le total ; à la fin, chaque ligne servie ou non. */
  function carteLignesVues(p, fin) {
    var photos = {};
    if (etat.cat) etat.cat.articles.forEach(function (a) { photos[a.numero] = a.photoNom; });
    if (etat.envoi) etat.envoi.lignes.forEach(function (l) { if (l.photo) photos[l.numero] = l.photo; });
    var n = 0;
    return h('div', { class: 'carte' }, p.lignes.map(function (l) {
      n += l.quantite;
      var marque = !fin ? null : l.fin === 'servie' ? h('span', { class: 'fin-ligne oui', 'aria-label': 'Servi' }, [icone('coche')])
        : l.fin === 'manquante' ? h('span', { class: 'fin-ligne manque', 'aria-label': 'Il n’y en avait plus' }, [icone('boiteVide')])
          : l.fin === 'pas_servie' ? h('span', { class: 'fin-ligne non', 'aria-label': 'Pas servi' }, [icone('croix')]) : null;
      return h('div', { class: 'ligne' + (l.fin === 'manquante' || l.fin === 'pas_servie' ? ' grisee' : '') }, [
        vignette(l.numero, l.quantite, photos[l.numero]),
        h('span', { class: 'ligne-nom' }, [l.quantite + ' × ' + (sansCoche(String(l.nom || '')) || 'Article n° ' + l.numero)]),
        marque || h('span', { class: 'ligne-prix' }, [montant(l.quantite * l.prix_unitaire)]),
      ]);
    }).concat([h('div', { class: 'total-panier' }, [h('span', { class: 'combien' }, [fin ? 'Total du panier' : articles(n)]), h('span', { class: 'montant' }, [montant(p.total)])])]));
  }
  /** Le message tout écrit pour la boutique, et le lien du panier : à lui seul, c'est le chemin d'aujourd'hui. */
  function lienPrevenir(e, p) {
    var wa = whatsappBoutique();
    if (!wa) return null;
    var prenom = F.prenomLisible(e.prenom || p.prenom || '');
    var texte = (prenom ? 'Bonjour, je suis ' + prenom + '.' : 'Bonjour.') + ' J’ai envoyé le panier n° ' + p.numero + ' (' +
      F.formaterNombre(p.total).replace(/ /g, ' ') + ' F) sur ta vitrine.\n' + adressePage() + '#p=' + lienDuPanierVu(e, p);
    return F.lienWhatsApp(wa, texte);
  }
  function ligneMiseAJour(e) {
    var texte = !e.maj ? '' : etat.horsLigne ? 'Pas de réseau : dernière nouvelle à ' + Res.heure(e.maj) + '.'
      : etat.serveurOccupe ? 'Beaucoup de monde en ce moment : dernière nouvelle à ' + Res.heure(e.maj) + '. Je regarde de nouveau dans 5 minutes.'
        : 'Mis à jour à ' + Res.heure(e.maj) + '.';
    return h('div', { class: 'mise-a-jour marge' }, [
      h('span', { class: 'note' }, [texte]),
      h('button', { class: 'bouton neutre petit', onclick: function () { relire(); } }, [icone('recommencer'), 'Actualiser']),
    ]);
  }

  /** « Garder mon suivi » : un lien à soi, le jeton dans la partie « # » (jamais envoyée à l'hébergeur de la page). */
  function lienDeSuivi(e) {
    return F.lienSuivi(adressePage(), e.code, e.demande, e.jeton);
  }
  function garderMonSuivi(e) {
    if (etat.garder) {
      copier(lienDeSuivi(e));
      parler('Ton lien de suivi est copié. Garde-le : il rouvre ce panier dans n’importe quel navigateur. Qui a ce lien peut voir et annuler ce panier.');
    }
    redessinerSuivi(true);
  }
  function blocGarder(e) {
    var lien = lienDeSuivi(e);
    return h('div', { class: 'carte' }, [
      h('div', { class: 'titre-carte petit' }, [icone('lien'), 'Ton lien de suivi (copié)']),
      h('p', { class: 'lien-suivi' }, [lien]),
      h('a', { class: 'bouton neutre large espace', rel: 'noopener noreferrer', href: 'https://wa.me/?text=' + encodeURIComponent(lien) }, [icone('whatsapp'), 'Me l’envoyer sur WhatsApp']),
      h('p', { class: 'note' }, ['Qui a ce lien peut voir et annuler ce panier.']),
    ]);
  }

  /** Les autres paniers envoyés à cette vitrine depuis ce téléphone. */
  function autresPaniers(e) {
    var autres = lireSuivis(e.code).filter(function (x) { return x.jeton !== e.jeton && x.panier; });
    if (!autres.length) return h('div');
    return h('div', { class: 'rangee marge' }, autres.map(function (x) {
      return h('button', { class: 'bouton neutre', onclick: function () { etat.envoi = x; etat.garder = false; etat.annuler = ''; vueSuivi(); relire(); } }, [icone('panier'), 'Panier n° ' + x.panier.numero]);
    }));
  }

  /** « Je ne veux plus ce panier » : discret, en bas ; la confirmation dit la suite. */
  function blocAnnuler(e, p) {
    if (etat.annuler === '') {
      return h('div', { class: 'centre marge' }, [h('button', { class: 'lien-discret grand', onclick: function () { etat.annuler = 'question'; redessinerSuivi(true); parler('La boutique verra que tu l’annules. Rien n’est dû.'); } }, ['Je ne veux plus ce panier'])]);
    }
    if (etat.annuler === 'pris') {
      var wa = whatsappBoutique();
      return h('div', { class: 'bandeau vieux' }, [
        h('div', { class: 'rang' }, [icone('appel'), 'La boutique est en train de le servir : appelle-la.']),
        wa ? h('a', { class: 'bouton neutre large espace', href: 'tel:+' + wa }, [icone('appel'), numeroBoutique(wa)]) : null,
      ]);
    }
    return h('div', { class: 'carte' }, [
      h('p', { class: 'note' }, ['La boutique verra que tu l’annules. Rien n’est dû.']),
      h('div', { class: 'rangee' }, [
        h('button', { class: 'bouton annuler', onclick: function () { annulerMonPanier(e); } }, [icone('croix'), 'Annuler le panier']),
        h('button', { class: 'bouton neutre', onclick: function () { etat.annuler = ''; redessinerSuivi(true); } }, ['Garder']),
      ]),
      etat.annuler === 'echec' ? h('p', { class: 'aide-erreur' }, ['Pas de réseau. Réessaie.']) : null,
    ]);
  }
  function annulerMonPanier(e) {
    Res.annulerMonPanier(fetcher, etat.serveur, e.jeton).then(function (r) {
      if (etat.envoi !== e) return;
      if (r && r.ok === true && r.panier) {
        etat.annuler = '';
        nouvelles(e, { maintenant: r.maintenant, panier: r.panier });
        if (r.panier.etat === 'annule') parler('Panier annulé.');
        redessinerSuivi(true);
      } else if (r && r.refus === 'pris') {
        if (r.panier) nouvelles(e, { maintenant: r.maintenant, panier: r.panier });
        etat.annuler = 'pris';
        redessinerSuivi(true);
        parler('La boutique est en train de le servir : appelle-la.');
      } else if (r && r.refus === 'panier_inconnu') panierPerdu(e);
      else { etat.annuler = 'echec'; redessinerSuivi(true); }
    }, function () {
      if (etat.envoi !== e) return;
      etat.annuler = 'echec';
      redessinerSuivi(true);
      parler('Pas de réseau. Réessaie.');
    });
  }

  // ------------------------------------------------------------ les fins

  function vueFin(e, p) {
    arreterSuivi();
    var nom = nomBoutique() || 'La boutique';
    var wa = whatsappBoutique();
    var phrase = phraseEtat(p);
    var vendu = p.etat === 'vendu';
    app.appendChild(h('div', { class: 'fin' }, [
      h('div', { class: 'rond-fin ' + (vendu ? 'vert' : 'neutre') }, [icone(vendu ? 'panier' : p.etat === 'refuse' ? (p.motif === 'pas_aujourdhui' ? 'calendrier' : 'boiteVide') : p.etat === 'expire' ? 'horloge' : 'croix'),
        vendu ? h('span', { class: 'coche-fin' }, [icone('coche')]) : null]),
      h('h1', {}, [vendu ? 'C’est servi. Merci !' : phrase]),
    ]));
    // Un résumé à garder (il tient dans une capture d'écran) : le numéro, la date, chaque ligne.
    app.appendChild(h('div', { class: 'carte ticket' }, [
      h('span', { class: 'rond-numero petit', 'aria-hidden': 'true' }, [String(p.numero)]),
      h('span', { class: 'ticket-texte' }, [
        h('span', { class: 'ticket-titre' }, ['Ton panier n° ' + p.numero]),
        h('span', { class: 'ticket-date' }, [nom + ' · ' + Res.dateLongue(p.fini_le || p.cree_le) + ', ' + Res.heure(p.fini_le || p.cree_le)]),
      ]),
    ]));
    app.appendChild(carteLignesVues(p, true));
    var boutons = [];
    var lignesDe = p.lignes.map(function (l) { return { numero: l.numero, quantite: l.quantite, nom: l.nom, prix: l.prix_unitaire }; });
    if (p.etat === 'refuse' && p.motif === 'pas_aujourdhui') {
      boutons.push(h('button', { class: 'bouton neutre large espace', onclick: revenirALaVitrine }, [icone('calendrier'), 'Refaire demain']));
    } else if (p.etat === 'refuse') {
      var sauf = lignesManquantes(p).map(function (l) { return l.numero; });
      boutons.push(h('button', { class: 'bouton valider large geant espace', onclick: function () { refaire(lignesDe, sauf); } }, [icone('recommencer'), 'Refaire un panier']));
    } else if (p.etat === 'annule') {
      boutons.push(h('button', { class: 'bouton valider large espace', onclick: function () { refaire(lignesDe, []); } }, [icone('recommencer'), 'Refaire un panier']));
    } else {
      if (p.etat === 'expire' && wa) {
        boutons.push(h('a', { class: 'bouton valider large espace', rel: 'noopener noreferrer', href: F.lienWhatsApp(wa, 'Bonjour, j’avais envoyé le panier n° ' + p.numero + ' sur ta vitrine.') }, [icone('whatsapp'), 'Lui écrire sur WhatsApp']));
      }
      boutons.push(h('button', { class: 'bouton neutre large espace', onclick: function () { refaire(lignesDe, []); } }, [icone('recommencer'), 'Refaire ce panier']));
    }
    if (vendu && etat.contenu) {
      // Le lien de la vitrine, marqué « lien partagé », sans rien de personnel. Aucune récompense.
      var partage;
      try { partage = adressePage() + '#c=' + F.changerOrigine(etat.contenu, 'lien'); } catch (x) { partage = ''; }
      if (partage) boutons.push(h('a', { class: 'bouton neutre large espace', rel: 'noopener noreferrer', href: 'https://wa.me/?text=' + encodeURIComponent('Voici la vitrine de ' + nom + ' : ' + partage) }, [icone('partager'), 'Partager cette boutique']));
    }
    app.appendChild(h('div', { class: 'marge' }, boutons));
    app.appendChild(autresPaniers(e));
    app.appendChild(piedEnLigne());
  }

  function texteSuivi(e) {
    var p = e.panier;
    if (!p) return 'Je regarde ton panier. ' + GARDE;
    var t = phraseEtat(p) + ' ';
    if (Res.estVivant(p.etat)) {
      t = 'Ton panier porte le numéro ' + p.numero + '. Envoyé à ' + Res.heure(p.cree_le) + '. ';
      if (p.recu_le) t += 'La boutique a reçu ton panier à ' + Res.heure(p.recu_le) + '. ';
      if (p.etat === 'pret' || p.etat === 'pris') t += phraseEtat(p) + ' ';
      else if (p.recu_le) t += texteEtMaintenant(e, p) + ' ';
      else if (p.delai_habituel) t += 'D’habitude, la boutique voit les paniers en ' + p.delai_habituel + ' minutes environ. ';
      t += articles(p.lignes.reduce(function (s, l) { return s + l.quantite; }, 0)) + ', ' + p.total + ' francs. ';
      if (p.etat !== 'pris') t += 'Sans réponse avant ' + Res.quand(p.expire_le, maintenantServeur()) + ', ton panier s’annule tout seul. Rien n’est dû. ';
      if (prevenirGros(e)) t += 'La boutique est peut-être occupée. Préviens-la sur WhatsApp. ';
      t += 'Tu peux fermer cette page. ' + ARGENT + ' ';
    }
    return t + GARDE;
  }

  // ------------------------------------------------------------ un lien de suivi (#s=) ouvert ici

  /** Le serveur d'un lien de suivi : celui de la vitrine déjà vue ici, sinon le serveur officiel, sinon (essais) celui de l'ordinateur. */
  function serveurDuSuivi(code) {
    var gardee = lire(STOCKAGE + 'catalogue.' + code);
    if (gardee && typeof gardee.c === 'string') {
      try {
        var lu = F.lireAdresse('#c=' + gardee.c);
        if (lu.type === 'catalogue') {
          var s = serveurDuCatalogue(lu.catalogue);
          if (s) return s;
        }
      } catch (x) { /* rien */ }
    }
    if (R.SERVEUR_OFFICIEL) return Res.serveurEnLigne('https://' + R.SERVEUR_OFFICIEL + '.supabase.co');
    return R.essai ? Res.serveurEnLigne('http://' + location.hostname + ':' + R.PORT_SERVEUR_ESSAI) : null;
  }
  function ouvrirSuivi(s) {
    var serveur = Res && enLignePossible() ? serveurDuSuivi(s.code) : null;
    if (!serveur) { vueErreur('suivi'); return; }
    etat.serveur = serveur;
    etat.code = s.code;
    restreindreImages(serveur.url, true);
    var gardee = lire(STOCKAGE + 'catalogue.' + s.code);
    etat.contenu = gardee && typeof gardee.c === 'string' ? gardee.c : '';
    var e = lireSuivis(s.code).filter(function (x) { return x.jeton === s.jeton; })[0];
    if (!e) {
      e = { code: s.code, cle: null, demande: s.demande, jeton: s.jeton, etat: 'envoye', t: Date.now(), lignes: [], panier: null };
      garderSuivi(e);
    }
    etat.envoi = e;
    vueSuivi();
    relire();
  }

  // ------------------------------------------------------------ départ

  function demarrer() {
    arreterSuivi();
    var texte = location.hash;
    // Rouvert dans Chrome par lienChrome : le catalogue est dans « ?c= » ; on le remet après le « # ».
    // Au secours de l'envoi direct, le panier et son jeton y sont aussi : rangés, puis retirés de l'adresse.
    if (!texte && /^\?c=/.test(location.search)) {
      var rc = F.lireRetourChrome(location.search);
      texte = rc ? '#c=' + rc.c : '#' + location.search.slice(1);
      etat.retourChrome = rc && rc.p && rc.j ? { p: rc.p, j: rc.j } : null;
      try { history.replaceState(null, '', adressePage() + texte); } catch (e) { /* rien */ }
    }
    etat.hash = texte;
    etat.ligne = null;
    etat.catLien = null;
    etat.envoi = null;
    etat.garder = false;
    etat.annuler = '';
    etat.refusLignes = {};
    etat.changements = [];
    etat.dejaVendu = false;
    var suivi = F.lireSuivi(texte);
    if (suivi) { ouvrirSuivi(suivi); return; }
    if (/^#s=/.test(texte)) { vueErreur('abime'); return; }
    var lu;
    try { lu = F.lireAdresse(texte); } catch (e) { vueErreur(e.code || 'abime'); return; }
    if (lu.type === 'panier') { vuePanierRecu(lu.panier, lu.texte); return; }
    etat.cat = lu.catalogue;
    etat.contenu = lu.texte;
    etat.photos = {};
    var origine = F.originePhotos(lu.catalogue);
    etat.panier = chargerPanier();
    etat.repris = etat.panier.montre !== '';
    if (lu.catalogue.enLigne) { choisirChemin(lu.catalogue); return; }
    if (origine) restreindreImages(origine, false);
    vueVitrine();
  }

  window.addEventListener('popstate', function () {
    if (etat.vue === 'panier' || etat.vue === 'ton-panier') { vueVitrine(); window.scrollTo(0, etat.defile); }
  });
  // Un autre lien dans le même onglet : tout autre hash que celui affiché redémarre la page.
  window.addEventListener('hashchange', function () {
    if (location.hash !== etat.hash) demarrer();
  });
  // Revenu sur la page : la relecture tout de suite (le suivi ne court que page visible).
  if (document.addEventListener) {
    document.addEventListener('visibilitychange', function () {
      if (visible() && etat.vue === 'suivi') relire();
    });
  }
  window.addEventListener('online', function () {
    annulerEnAttente();
    if (etat.vue === 'suivi') relire();
  });
  demarrer();
  annulerEnAttente();
})();
</script>
</body>
</html>
